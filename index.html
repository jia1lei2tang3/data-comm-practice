试题-24级", "index": 68, "type": "单选题", "body": "TCP/IP参考模型的网络层提供的是( ) 。", "options": ["A. 无连接不可靠的数据报服务", "B. 无连接可靠的数据报服务", "C. 有连接不可靠的虚电路服务", "D. 有连接可靠的虚电路服务"], "answer": "A", "explain": "网络层提供无连接不可靠的数据报服务。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 69, "type": "单选题", "body": "某 网 络 拓 扑 如 图 4- 69所 示,路 由 器 R1 只 有 到 达 子 网192.168.1.0/24 的路由。为使 R1 可以将 IP 分组正确地路由到图中所有子网,则在R1 中需要增加的一条路由(目的网络,子网掩码,下一跳)是( ) 。[像领] 习题4-69图", "options": ["A. 192.168.2.0,255.255.255.128,192.168.1.1", "B. 192.168.2.0,255.255.255.0,192.168.1.1", "C. 192.168.2.0,255.255.255.128,192.168.1.2", "D. 192.168.2.0,255.255.255.0,192.168.1.2"], "answer": "D", "explain": "R1 缺到 192.168.2.0/24 的路由，下一跳 192.168.1.2。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 70, "type": "单选题", "body": "在TCP/IP 体系结构中,直接为 ICMP 提供服务的协议是( ) 。", "options": ["A. PPP", "B. IP", "C. UDP", "D. TCP"], "answer": "B", "explain": "ICMP 直接由 IP 提供服务（封装在 IP 数据报中）。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 71, "type": "单选题", "body": "某路由表中有转发接口相同的 4 条路由表项,其目的网络地址分别为 35.230.32.0/21、 35.230.40.0/21、35.230.48.0/21 和 35.230.56.0/21,将该 4条路由聚合后的目的网络地址为( ) 。", "options": ["A. 35.230.0.0/19", "B. 35.230.0.0/20", "C. 35.230.32.0/19", "D. 35.230.32.0/20"], "answer": "C", "explain": "32/40/48/56 四个 /21 覆盖 32~63，聚合为 35.230.32.0/19。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 72, "type": "单选题", "body": "某网络中的所有路由器均采用距离向量路由算法计算路由。若路由器 E 与邻居路由器 A、 B、 C 和 D 之间的直接链路距离分别是 8、 10、 12 和 6,且 E 收到邻居路由器的距离向量如图 4- 72所示,则路由器 E 更新后的到达目的网络 Net1~Net4 的距离分别是( ) 。[像领] 习题4-72图", "options": ["A. 9,10, 12, 6", "B. 9,10, 28, 20", "C. 9,20, 12, 20", "D. 9,20, 28, 20"], "answer": "D", "explain": "距离向量：经 A 到各网=8+A 表值，取最小得 9、20、28、20。"}, {"sheet": "第5章运输层作业", "index": 1, "type": "单选题", "body": "TCP 和UDP 协议的相似之处是( )", "options": ["A. 面向连接的协议", "B. 面向非连接的协议", "C. 传输层协议", "D. 以上均不对"], "answer": "C", "explain": "TCP 面向连接，UDP 无连接，二者共同点是都属传输层协议。"}, {"sheet": "第5章运输层作业", "index": 2, "type": "单选题", "body": "小于___的TCP/UDP端口号已保留与现有服务一一对应,此数字以上的端口号可自由分配。( )", "options": ["A. 199", "B. 100", "C. 1024", "D. 2048"], "answer": "C", "explain": "0~1023 为熟知端口，1024 以上可自由分配。"}, {"sheet": "第5章运输层作业", "index": 3, "type": "单选题", "body": "传输层可以通过( )标识不同的应用。", "options": ["A. 物理地址", "B. 端口号", "C. IP地址", "D. 逻辑地址"], "answer": "B", "explain": "传输层用端口号标识不同应用进程。"}, {"sheet": "第5章运输层作业", "index": 4, "type": "单选题", "body": "三次握手方法用于( ) 。", "options": ["A. 传输层连接的建立", "B. 数据链路层的流量控制", "C. 传输层的重复检测", "D. 传输层的流量控制"], "answer": "A", "explain": "三次握手用于 TCP 传输层连接的建立。"}, {"sheet": "第5章运输层作业", "index": 5, "type": "单选题", "body": "TCP的协议数据单元被称为( ) 。", "options": ["A. 比特", "B. 帧", "C. 分段", "D. 字符"], "answer": "C", "explain": "TCP 的协议数据单元称为报文段（分段）。"}, {"sheet": "第5章运输层作业", "index": 6, "type": "单选题", "body": "下面提供FTP服务的默认TCP端口号是( ) 。", "options": ["A. 21", "B. 25", "C. 23", "D. 80"], "answer": "A", "explain": "FTP 默认端口 21；25 是 SMTP，23 是 Telnet，80 是 HTTP。"}, {"sheet": "第5章运输层作业", "index": 7, "type": "单选题", "body": "TCP/IP协议规定为( ) 。", "options": ["A. 4层", "B. 5层", "C. 6层", "D. 7层"], "answer": "A", "explain": "TCP/IP 体系结构共 4 层。"}, {"sheet": "第5章运输层作业", "index": 8, "type": "单选题", "body": "对于下列说法,错误的是( ) 。", "options": ["A. TCP协议可以提供可靠的数据流传输服务", "B. TCP协议可以提供面向连接的数据流传输服务", "C. TCP协议可以提供全双工的数据流传输服务", "D. TCP协议可以提供面向非连接的数据流传输服务"], "answer": "D", "explain": "TCP 是面向连接的，D 说法错误。"}, {"sheet": "第5章运输层作业", "index": 9, "type": "单选题", "body": "以下关于TCP/IP协议的描述中,哪个是错误的( ) 。", "options": ["A. TCP/IP协议属于应用层", "B. TCP、UDP协议都要通过IP协议来发送、接收数据", "C. TCP协议提供可靠的面向连接服务", "D. UDP协议提供简单的无连接服务"], "answer": "A", "explain": "TCP/IP 是协议族不是应用层，A 说法错误。"}, {"sheet": "第5章运输层作业", "index": 10, "type": "单选题", "body": "在Internet中,传输层协议_______可保证数据的可靠传输。( )", "options": ["A. EGP", "B. UDP", "C. TCP", "D. ICMP"], "answer": "C", "explain": "TCP 提供可靠传输；UDP 简单无连接不可靠。"}, {"sheet": "第5章运输层作业", "index": 11, "type": "单选题", "body": "在Internet上用TCP/IP播放视频,想用传输层的最快协议,以减少时延,要使用______。( )", "options": ["A. UDP协议的低开销特性", "B. UDP协议的高开销特性", "C. TCP协议的低开销特性", "D. TCP协议的高开销特性"], "answer": "A", "explain": "UDP 首部小、无连接建立开销，适合视频等实时应用。"}, {"sheet": "第5章运输层作业", "index": 12, "type": "单选题", "body": "关于TCP拥塞控制的错误的描述是( )", "options": ["A. 当已发送报文段的应答到达,拥塞窗口大小加倍。", "B. 以分组丢失而超时为拥塞标志", "C. 当属于一个拥塞窗口的某个已发送报文段丢失,拥塞窗口大小开始线性增长", "D. 发送方取“拥塞窗口”和“接收方承认的窗口”两者最小值作为发送窗口"], "answer": "C", "explain": "拥塞窗口丢失后应减半再线性增长，C 描述错误。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 1, "type": "单选题", "body": "OSI 参考模型中,提供端到端的透明数据传输服务、差错控制和流量控制的层是 ( )。", "options": ["A. 物理层", "B. 网络层", "C. 运输层", "D. 会话层"], "answer": "C", "explain": "运输层提供端到端的透明数据传输、差错控制和流量控制。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 2, "type": "单选题", "body": "运输层为( )之间提供逻辑通信。", "options": ["A. 主机", "B. 进程", "C. 路由器", "D. 操作系统"], "answer": "B", "explain": "运输层为进程之间提供逻辑通信。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 3, "type": "单选题", "body": "运输层面向连接服务的特性是( )。", "options": ["A. 不保证可靠和顺序交付", "B. 不保证可靠但保证顺序交付", "C. 保证可靠但不保证顺序交付", "D. 保证可靠和顺序交付"], "answer": "D", "explain": "面向连接服务保证可靠和顺序交付。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 4, "type": "单选题", "body": "能够唯一确定一个在因特网上通信的进程的是( )。", "options": ["A. 主机名", "B. IP地址和MAC地址", "C. MAC地址和端口号", "D. IP地址和端口号"], "answer": "D", "explain": "IP 地址定位主机，端口号定位进程，二者组合唯一确定通信进程。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 5, "type": "单选题", "body": "因特网上为常用的应用层协议(例如 FTP、 HTTP 等)保留的熟知端口号的范围是( )。", "options": ["A. 0 到 127", "B. 0 到 255", "C. 0 到 511", "D. 0 到 1023"], "answer": "D", "explain": "熟知端口号范围是 0 到 1023。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 6, "type": "单选题", "body": "使用 UDP 的网络应用,其数据传输的可靠性由( )。", "options": ["A. 运输层负责", "B. 应用层负责", "C. 数据链路层负责", "D. 网际层负责"], "answer": "B", "explain": "UDP 不保证可靠，可靠性由应用层自行解决。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 7, "type": "单选题", "body": "接收端收到有差错的 UDP 用户数据报时的处理方式是( )。", "options": ["A. 丢弃", "B. 请求重传", "C. 纠错", "D. 忽略差错"], "answer": "A", "explain": "UDP 校验出错即丢弃，不请求重传。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 8, "type": "单选题", "body": "UDP数据报首部不包含( )。", "options": ["A. 源端口号", "B. 目的端口号", "C. 检验和", "D. UDP用户数据报首部长度"], "answer": "D", "explain": "UDP 首部只有源端口、目的端口、长度、检验和 4 个字段，无首部长度字段。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 9, "type": "单选题", "body": "UDP用户数据报比IP数据报多提供了( )。", "options": ["A. 流量控制", "B. 拥塞控制", "C. 端口功能", "D. 路由转发"], "answer": "C", "explain": "相比 IP 数据报，UDP 多了端口复用分用功能。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 10, "type": "单选题", "body": "以下关于 UDP协议的主要特点的描述中,错误的是( )。", "options": ["A. UDP报头主要包括端口号、长度、校验和等字段", "B. UDP长度字段是 UDP 数据报的长度,包括伪首部的长度", "C. UDP校验和对伪首部、UDP报头及应用层数据进行校验", "D. 伪首部包括 IP 数据报首部的一部分"], "answer": "B", "explain": "UDP 长度字段是 UDP 数据报（首部+数据）的长度，不含伪首部。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 11, "type": "单选题", "body": "下列关于UDP协议的叙述中,正确的是( )。I.是 TCP/IP 参考模型网际层中的协议II.提供无连接服务III.通过差错校验,保证可靠数据传输IV. 提供复用/分用服务", "options": ["A. 仅 I", "B. 仅 I、 III", "C. 仅 II、 IV", "D. I、 II、 III、 IV"], "answer": "C", "explain": "UDP 属运输层、无连接、不可靠，但提供复用/分用，II 和 IV 正确。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 12, "type": "单选题", "body": "下列不属于 TCP 服务特点的是( )。", "options": ["A. 面向字节流", "B. 全双工", "C. 可靠", "D. 支持广播"], "answer": "D", "explain": "TCP 是点对点的，不支持广播。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 13, "type": "单选题", "body": "包含在 TCP 首部中,但不包含在 UDP 首部中的字段是( )。", "options": ["A. 目的端口号", "B. 序号", "C. 检验和", "D. 目的 IP 地址"], "answer": "B", "explain": "序号字段是 TCP 特有的，UDP 首部没有序号。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 14, "type": "单选题", "body": "某计算机使用 IPv4 的 TCP/IP 协议栈发送数据,若应用层待发送数据为 200B,运输层使用 UDP 协议,网际层使用 IP 协议且 IP 数据报采用固定长度的首部(即无可变部分),网络接口层使用以太网 V2(忽略前导码),则应用层数据的传输效率约为( )。", "options": ["A. 78%", "B. 81%", "C. 92%", "D. 100%"], "answer": "B", "explain": "UDP 8B+IP 20B 开销，效率 200/248≈81%。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 15, "type": "单选题", "body": "以下说法错误的是( )。", "options": ["A. 运输层是 OSI 模型自下而上的第四层", "B. 运输层提供的是主机间的点到点数据传输", "C. TCP是面向连接的,UDP是无连接的", "D. TCP进行流量控制和拥塞控制,而 UDP 既不进行流量控制,又不进行拥塞控制"], "answer": "B", "explain": "运输层提供的是进程间的端到端通信，不是主机间点到点，B 错误。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 16, "type": "单选题", "body": "下列关于 TCP 协议的叙述中,正确的是( )。I.是 TCP/IP 参考模型网际层中的协议II.提供无连接服务III.仅通过差错校验,即可确保可靠数据传输IV.提供复用/分用服务", "options": ["A. 仅 I", "B. 仅 I、 II", "C. 仅 II、 IV", "D. 仅 IV"], "answer": "D", "explain": "TCP 属运输层、面向连接、可靠传输靠确认重传等机制，仅 IV 正确。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 17, "type": "单选题", "body": "在采用TCP连接的数据传输阶段,如果发送端的发送窗口值由 1000 变为 2000,那么发送端在收到一个确认之前可以发送( )。", "options": ["A. 2000 个TCP报文段", "B. 2000B", "C. 1000B", "D. 1000个TCP报文段"], "answer": "B", "explain": "发送窗口以字节为单位，窗口值 2000 表示可发 2000B。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 18, "type": "单选题", "body": "A和B之间建立了TCP连接,A向B发送了一个报文段,其中序号字段 seq=200,确认号字段 ack=201,数据部分有 2个字节,那么在B对该报文段的确认段中的seq和ack的值分别是( )。", "options": ["A. seq=202, ack=200", "B. seq=201, ack=201", "C. seq=201, ack=202", "D. seq=202, ack=201"], "answer": "C", "explain": "B 的确认段 seq=201（B 自己的序号），ack=200+2=202。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 19, "type": "单选题", "body": "TCP“三报文握手” 过程中,第二个报文首部中被置为 1 的标志位有( )。", "options": ["A. 仅 SYN", "B. 仅 ACK", "C. ACK 和 RST", "D. SYN 和 ACK"], "answer": "D", "explain": "第二次握手是 SYN 和 ACK 同时置 1。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 20, "type": "单选题", "body": "TCP 的通信双方,有一方发送了FIN标志位被置1的数据段,表示( )。", "options": ["A. 将断开通信双方的TCP 连接", "B. 单方面释放连接,表示本方已经无数据发送,但可以接收对方的数据", "C. 中止数据发送,双方都不能发送数据", "D. 连接被重新建立"], "answer": "B", "explain": "FIN=1 表示单方面释放，本方无数据要发但仍可接收。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 21, "type": "单选题", "body": "以下关于 TCP 工作原理与过程的描述中,错误的是( )。", "options": ["A. TCP连接建立过程需要经过“三报文握手”的过程", "B. TCP传输连接建立后,客户端与服务器端的应用进程进行全双工的字节流传输", "C. TCP传输连接的释放过程很复杂,只有客户端可以主动提出释放连接的请求", "D. TCP连接的释放需要经过“四报文挥手”的过程"], "answer": "C", "explain": "客户端和服务器都可以主动释放连接，C 说法错误。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 22, "type": "单选题", "body": "若主机甲主动发起一个和主机乙的 TCP 连接,甲、乙选择的初始序号分别为 2020和1666,则第三次握手 TCP 段的确认序号是( )。", "options": ["A. 2019", "B. 2020", "C. 1666", "D. 1667"], "answer": "D", "explain": "第三次握手确认乙的序号，ack=1666+1=1667。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 23, "type": "单选题", "body": "若主机甲主动发起一个和主机乙的 TCP 连接,甲、乙选择的初始序号分别为 2021和2022,则主机甲发送的第二个 TCP 段的序号和确认序号分别是( )。", "options": ["A. 2021,2022", "B. 2022,2022", "C. 2022,2023", "D. 2023,2023"], "answer": "C", "explain": "甲第二个段 seq=2021+1=2022，ack=2022+1=2023。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 24, "type": "单选题", "body": "主机甲发起与主机乙的TCP连接,主机甲选择的初始序号 seq=16666,若主机乙接受该连接请求,则主机乙向主机甲发送的正确的TCP段的首部相关标志位和字段的值可能是( )。", "options": ["A. SYN=0, ACK=0, seq=16667, ack=16667", "B. SYN=1, ACK=1, seq=16666, ack=16666", "C. SYN=0, ACK=0, seq=16666, ack=16666", "D. SYN=1, ACK=1, seq=16667, ack=16667"], "answer": "D", "explain": "乙应答 SYN+ACK，seq 用自己序号 16667，ack=16666+1=16667。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 25, "type": "单选题", "body": "主机A 与B之间已成功建立了一个TCP 连接,A向 B发送了3个连续的TCP段,分别包含 200 字节、 400 字节和 600字节的有效载荷,第1个段的序号为100, 则B正确接收到3个段后,发送给A的确认号是( )。", "options": ["A. 700", "B. 900", "C. 1200", "D. 1300"], "answer": "D", "explain": "序号 100+200+400+600=1300，确认号为 1300。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 26, "type": "单选题", "body": "主机甲与主机乙之间已建立一个TCP连接,双方持续有数据传输,且数据无差错与丢失。若甲收到1个来自乙的 TCP 段,该段的序号为 2020、确认号为 1166、有效载荷为300字节,则甲立即发送给乙的TCP段的序号和确认号分别是( )。", "options": ["A. 1166,2319", "B. 1166,2320", "C. 1167,2319", "D. 1167,2320"], "answer": "B", "explain": "确认号等于已收字节数 1166 不变；seq=2020+300=2320。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 27, "type": "单选题", "body": "下列能反映出网络中发生了拥塞现象的是( )。", "options": ["A. 随着网络负载的增加,吞吐量反而降低", "B. 随着网络负载的增加,吞吐量也相应增加", "C. 网络节点接收和发出的分组越来越多", "D. 网络节点接收和发出的分组越来越少"], "answer": "A", "explain": "负载增加而吞吐量反而下降是拥塞的典型表现。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 28, "type": "单选题", "body": "以下关于TCP窗口与拥塞控制概念的描述中,错误的是( )。", "options": ["A. 接收窗口(rwnd)通过TCP首部中的窗口字段通知数据的发送方", "B. 发送窗口确定的依据是:发送窗口=min[接收端窗口,拥塞窗口]", "C. 拥塞窗口是接收端根据网络拥塞情况确定的窗口值", "D. 拥塞窗口大小在开始时可以按指数规律增长"], "answer": "C", "explain": "拥塞窗口由发送方根据拥塞情况确定，不是接收端确定。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 29, "type": "单选题", "body": "在一个 TCP连接中,MSS为1KB,当拥塞窗口为34KB时发生了超时事件。如果在接下来的4个RTT内报文段传输都是成功的,那么当这些报文段均得到确认后,拥塞窗口的大小是( )。", "options": ["A. 8KB", "B. 9KB", "C. 16KB", "D. 17KB"], "answer": "C", "explain": "超时后阈值降为 17KB，窗口从 1KB 慢启动：1→2→4→8→16，4 个 RTT 后 16KB。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 30, "type": "单选题", "body": "在一个TCP连接中,MSS 为1KB,当拥塞窗口为34KB 时收到了3个重复ACK报文段。如果在接下来的4个 RTT内报文段传输都是成功的,那么当这些报文段均得到确认后,拥塞窗口的大小是( )。", "options": ["A. 8KB", "B. 16KB", "C. 20KB", "D. 21KB"], "answer": "D", "explain": "3 个重复 ACK 触发快恢复：阈值 17KB，窗口 17KB 起每 RTT 加 1，4 个 RTT 后 21KB。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 31, "type": "单选题", "body": "若主机甲与主机乙已建立一条 TCP 连接, 最大段长 MSS为1KB,往返时间RTT为 1ms,则在不出现拥塞的前提下,拥塞窗口从8KB增长到11KB所需的最长时间是( )。", "options": ["A. 1ms", "B. 2ms", "C. 3ms", "D. 4ms"], "answer": "C", "explain": "拥塞避免阶段每 RTT 加 1KB，8→11 需 3 个 RTT 即 3ms。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 32, "type": "单选题", "body": "若甲向乙发起一个TCP连接,最大段长 MSS=1KB,RTT=8ms,乙开辟的接收缓存为32KB,则甲从连接建立成功至发送窗口达到16KB,需经过的时间至少是( )。", "options": ["A. 16ms", "B. 32ms", "C. 64ms", "D. 128ms"], "answer": "B", "explain": "慢启动窗口 1→2→4→8→16，需 4 个 RTT 共 32ms。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 33, "type": "单选题", "body": "在TCP协议中,发送方的窗口大小取决于( )。", "options": ["A. 仅接收方允许的窗口", "B. 接收方允许的窗口和发送方允许的窗口", "C. 接收方允许的窗口和拥塞窗口", "D. 发送方允许的窗口和拥塞窗口"], "answer": "C", "explain": "发送窗口取接收窗口和拥塞窗口的较小值。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 34, "type": "单选题", "body": "主机甲与主机乙之间已建立一个TCP连接,主机甲向主机乙发送了两个连续的 TCP 段,分别包含 300 字节和 500 字节的有效载荷,第一个段的序列号为 200,主机乙正确接收到两个段后,发送给主机甲的确认序列号是( )。", "options": ["A. 500", "B. 700", "C. 800", "D. 1000"], "answer": "D", "explain": "确认号为 200+300+500=1000。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 35, "type": "单选题", "body": "一个 TCP 连接总是以 1KB 的最大段长发送 TCP段,发送方有足够多的数据要发送。 当拥塞窗口为 16KB 时发生了超时,如果接下来的4个 RTT(往返时间 时间内的TCP段的传输都是成功的,那么当第4个RTT时间内发送的所有 TCP 段都得到肯定应答时,拥塞窗口大小是( )。", "options": ["A. 7KB", "B. 8KB", "C. 9KB", "D. 16KB"], "answer": "C", "explain": "超时后阈值 8KB，窗口 1→2→4→8→9（第 4 个 RTT 进入拥塞避免），共 9KB。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 36, "type": "单选题", "body": "主机甲和主机乙之间已建立了一个 TCP 连接, TCP 最大段长度为 1 000 字节。若主机甲的当前拥塞窗口为 4 000 字节,在主机甲向主机乙连续发送两个最大段后,成功收到主机乙发送的第一个段的确认段,确认段中通告的接收窗口大小为2 000字节,则此时主机甲还可以向主机乙发送的最大字节数是( )。", "options": ["A. 1000", "B. 2000", "C. 3000", "D. 4000"], "answer": "A", "explain": "收到确认后窗口按 4000+2×1000=6000，由 min(6000,阈值) 决定，阈值 1000 则窗口 1000B。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 37, "type": "单选题", "body": "主机甲向主机乙发送一个(SYN=1,seq=11220)的TCP段,期望与主机乙建立 TCP 连接, 若主机乙接受该连接请求, 则主机乙向主机甲发送的正确的 TCP 段可能是( )。", "options": ["A. (SYN=0,ACK=0,seq=11221,ack=11221)", "B. (SYN=1,ACK=1,seq=11220,ack=11220)", "C. (SYN=1,ACK=1,seq=11221,ack=11221)", "D. (SYN=0,ACK=0,seq=11220,ack=11220)"], "answer": "C", "explain": "乙应答 SYN+ACK：seq=乙序号 11221，ack=11220+1=11221。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 38, "type": "单选题", "body": "主机甲与主机乙之间已建立一个TCP连接,主机甲向主机乙发送了3个连续的TCP段,分别包含 300 字节、400 字节和 500 字节的有效载荷,第3个段的序号为 900。若主机乙仅正确接收到第 1 和第3个段,则主机乙发送给主机甲的确认序号是( )。", "options": ["A. 300", "B. 500", "C. 1200", "D. 1400"], "answer": "B", "explain": "乙只收到第 3 段，确认号=900+500=1400 减前两段 900=500。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 39, "type": "单选题", "body": "主机甲与主机乙之间已建立一个TCP连接,双方持续有数据传输,且数据无差错与丢失。 若甲收到 1个来自乙的TCP段, 该段的序号为 1913、确认序号为2046、有效载荷为 100 字节,则甲立即发送给乙的TCP段的序号和确认序号分别是( )。", "options": ["A. 2046、2012", "B. 2046、2013", "C. 2047、2012", "D. 2047、2013"], "answer": "B", "explain": "甲收到的段 ack=2046 不变回填；甲 seq=1913+100=2013。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 40, "type": "单选题", "body": "主机甲和主机乙已建立了TCP 连接,甲始终以MSS=1KB大小的段发送数据,并一直有数据发送;乙每收到一个数据段都会发出一个接收窗口为10KB 的确认段。若甲在 t 时刻发生超时时拥塞窗口为 8KB,则从 t 时刻起,不再发生超时的情况下,经过 10个 RTT 后, 甲的发送窗口是( )。", "options": ["A. 10KB", "B. 12KB", "C. 14KB", "D. 15KB"], "answer": "A", "explain": "超时后窗口取 min(阈值,接收窗口 10KB)，从 1KB 起每 RTT 翻倍，4 个 RTT 达 10KB。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 41, "type": "单选题", "body": "下列关于UDP协议的叙述中,正确的是( )。I.提供无连接服务II.提供复用/分用服务III.通过差错校验,保障可靠数据传输", "options": ["A. 仅 I", "B. 仅 I、 II", "C. 仅 II、 III", "D. I、 II、 III"], "answer": "B", "explain": "UDP 无连接、提供复用分用，不保证可靠，I 和 II 正确。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 42, "type": "单选题", "body": "主机甲和主机乙新建一个TCP连接,甲的拥塞控制初始阈值为32 KB,甲向乙始终以 MSS=1 KB 大小的段发送数据, 并一直有数据发送; 乙为该连接分配 16 KB 接收缓存,并对每个数据段进行确认,忽略段传输延迟。若乙收到的数据全部存入缓存,不被取走,则甲从连接建立成功时刻起,未发生超时的情况下,经过 4个RTT 后, 甲的发送窗口是( )。", "options": ["A. 1KB", "B. 8KB", "C. 16KB", "D. 32KB"], "answer": "A", "explain": "窗口受接收窗口 16KB 和阈值 32KB 限制，慢启动后首次限制值为 16KB 时窗口 1KB。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 43, "type": "单选题", "body": "若甲向乙发起一个TCP连接,最大段长 MSS=1KB,RTT=5ms,乙开辟的接收缓存为 64KB, 则甲从连接建立成功至发送窗口达到 32KB,需经过的时间至少是( )。", "options": ["A. 25ms", "B. 30ms", "C. 160ms", "D. 165ms"], "answer": "A", "explain": "慢启动 1→2→4→8→16→32 需 5 个 RTT 共 25ms。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 44, "type": "单选题", "body": "UDP 协议实现分用(demultiplexing)时所依据的头部字段是( )。", "options": ["A. 源端口号", "B. 目的端口号", "C. 长度", "D. 校验和"], "answer": "B", "explain": "UDP 依据目的端口号实现分用。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 45, "type": "单选题", "body": "某客户通过一个 TCP 连接向服务器发送数据的部分过程如图5- 45所示。客户在 t0 时刻第一次收到确认序列号 ack_seq=100 的段,并发送序列号 seq=100 的段,但发生丢失。 若 TCP 支持快速重传,则客户重新发送 seq=100段的时刻是( )。[凝真] 习题4-45 图", "options": ["A. t1", "B. t2", "C. t3", "D. t4"], "answer": "C", "explain": "收到 ack_seq=100 的段后即 t0 时刻发送 seq=100，对应图中 t3。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 46, "type": "单选题", "body": "主机甲主动发起一个与主机乙的 TCP 连接,甲、乙选择的初始序列号分别为 2018 和 2046,则第三次握手 TCP 段的确认序列号是( )。", "options": ["A. 2018", "B. 2019", "C. 2046", "D. 2047"], "answer": "D", "explain": "第三次握手 ack=乙初始序号+1=2047。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 47, "type": "单选题", "body": "若主机甲与主机乙建立TCP连接时发送的SYN段中的序号为1000, 在断开连接时, 甲发送给乙的FIN段中的序号为5001,则在无任何重传的情况下,甲向乙已经发送的应用层数据的字节数为( )。", "options": ["A. 4002", "B. 4001", "C. 4000", "D. 3999"], "answer": "C", "explain": "FIN 序号 5001 前的字节数是 5001-1000-1=4000。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 48, "type": "单选题", "body": "若客户首先向服务器发送 FIN 段请求断开TCP连接,则当客户收到服务器发送的 FIN 段并向服务器发送了 ACK 段后,客户的 TCP状态转换为( )。", "options": ["A. CLOSE_WAIT", "B. TIME_WAIT", "C. FIN_WAIT_1", "D. FIN_WAIT_2"], "answer": "B", "explain": "主动关闭方发完最后 ACK 后进入 TIME_WAIT。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 49, "type": "单选题", "body": "若大小为12B 的应用层数据分别通过1个UDP 数据报和1个TCP段传输, 则该 UDP 数据报和 TCP 段实现的有效载荷(应用层数据)最大传输效率分别是( )。", "options": ["A. 37.5%,16.7%", "B. 37.5%,37.5%", "C. 60.0%,16.7%", "D. 60.0%,37.5%"], "answer": "D", "explain": "UDP 效率 12/20=60%；TCP 12/32=37.5%。"}, {"sheet": "第5章 运输层 课后测试题-2404211", "index": 50, "type": "单选题", "body": "假设主机甲通过TCP向主机乙发送数据,部分过程如图 5- 50所示。甲在 t0 时刻发送了一个序号 seq=501、封装 200B 数据的段,在 t1 时刻收到乙发送的序号 seq=601、确认序号 ack_seq=501、接收窗口 rcvwnd=500B 的段,则甲在未收到新的确认段之前可以继续向乙发送的数据序号范围是( )。[凝真] 习题4-50图", "options": ["A. 501~1000", "B. 601~1000", "C. 701~1000", "D. 801~1100"], "answer": "C", "explain": "t0 发 501+200B，t1 收到 ack=601 的段，重传起点 601，加上后续 501~1000 范围中未确认部分。"}, {"sheet": "2022-第1章-时延--练习题", "index": 1, "type": "填空题", "body": "收发两端之间的传输距离为2000km，信号在媒体上的传播速率为2×10^8m/s，数据长度为10^6bit，数据发送速率为100kb/s。计算：发送时延为 [填空1] s，传播时延为 [填空2] s。", "options": [], "answer": [["10"], ["0.01"]], "explain": "发送时延=数据长度/发送速率，传播时延=距离/传播速率。"}, {"sheet": "2023-第3章最小帧长-练习题", "index": 1, "type": "填空题", "body": "假定1km长的CSMA/CD网络的数据率为1Gb/s。设信号在网络上的传播速率为200000km/s。求能够使用此协议的最短帧长。（1）此网络端到端传播时延为 [填空1] 微秒。（2）争用期时间为 [填空2] 微秒。（3）能够使用此协议的最短帧长为 [填空3] 比特。", "options": [], "answer": [["5"], ["10"], ["10000"]], "explain": "最短帧长=争用期×数据率，争用期=2×端到端传播时延。"}, {"sheet": "2022-第3章CRC-练习题", "index": 1, "type": "单选题", "body": "要发送的数据为1101011011。采用CRC的生成多项式是P（X）=X^4+X+1。试求应添加在数据后面的余数为（）。", "options": ["A. 1100", "B. 1110", "C. 1111", "D. 1101"], "answer": "B", "explain": "CRC 校验：待发送数据后添加 n 位余数（n=生成多项式最高次数），余数由模 2 除法求得。"}, {"sheet": "2021-TCP序号-练习题", "index": 1, "type": "填空题", "body": "主机A向主机B连续发送了两个TCP报文段，其序号分别为200和380。试问：（1）第一个报文段携带了 [填空1] 字节的数据。（2）主机B收到第一个报文段后发回的确认中的确认号应当是 [填空2]。（3）如果主机B收到第二个报文段后发回的确认中的确认号是580，试问A发送的第二个报文段中的数据有 [填空3]字节。（4）如果A发送的第一个报文段丢失了，但第二个报文段到达了B。B在第二个报文段到达后向A发送确认。试问这个确认号应为 [填空4]。", "options": [], "answer": [["180"], ["380"], ["200"], ["200"]], "explain": "确认号=期望收到的下一字节序号；报文段数据量=后一段序号−前一段序号。"}, {"sheet": "2024-运输层-流量控制-练习题", "index": 1, "type": "填空题", "body": "如下图，设A向B发送数据。当B发给A：ACK=1，ack=201，rwnd=300时，表示允许A发送 [填空1]字节的数据，序号从 [填空2] 到 [填空3]。", "options": [], "answer": [["300"], ["201"], ["500"]], "explain": "rwnd 是接收窗口大小；A 可发送序号 ack 到 ack+rwnd−1 的数据。"}];
const STORE_KEY = 'ykt-practice-v1';

/* ---------- 数据整理 ---------- */
function qid(q) { return q.sheet + '|' + q.index; }
const SHEET_ORDER = [];
const BY_SHEET = {};
for (const q of DATA) {
  if (!BY_SHEET[q.sheet]) { BY_SHEET[q.sheet] = []; SHEET_ORDER.push(q.sheet); }
  BY_SHEET[q.sheet].push(q);
}

/* 章节分组：按章号归并，无章号的归入课堂练习 */
const CARD_ALIAS = {
  '2022-第1章-时延--练习题': '第1章 时延',
  '2023-第3章最小帧长-练习题': '第3章 最小帧长',
  '2022-第3章CRC-练习题': '第3章 CRC',
  '2021-TCP序号-练习题': 'TCP 序号',
  '2024-运输层-流量控制-练习题': '运输层 流量控制'
};
const CHAPTERS = [];
for (const s of SHEET_ORDER) {
  const m = s.match(/^(第\d+章)\s*(.*?)(?:作业|课后测试题)/);
  const chapter = m ? m[1] : '课堂练习';
  const title = m ? m[2].trim() : '课堂练习';
  let c = CHAPTERS.find(x => x.chapter === chapter);
  if (!c) { c = { chapter, title, sheets: [] }; CHAPTERS.push(c); }
  else if (c.title === '' && title !== '') { c.title = title; }
  c.sheets.push(s);
}

/* ---------- 存储 ---------- */
let store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { store = {}; }
if (!store.wrong) store.wrong = {};
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* ---------- 状态 ---------- */
let quiz = [];        // 当前题目队列
let pos = 0;
let correctCount = 0;
let judged = false;
let mode = 'seq';
let sessionAnswers = {};  // 本次练习作答记录

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 首页 ---------- */
function renderHome() {
  $('totalCount').textContent = DATA.length;
  const stackEl = $('stack');
  stackEl.innerHTML = '';
  for (const c of CHAPTERS) {
    const bar = document.createElement('div');
    bar.className = 'stack-bar';
    const label = document.createElement('div');
    label.className = 'stack-label';
    const chap = document.createElement('span');
    chap.className = 'stack-chapter';
    chap.innerHTML = '<span class="mono">' + c.chapter + '</span>';
    const nm = document.createElement('span');
    nm.className = 'stack-name';
    nm.textContent = c.title;
    label.appendChild(chap); label.appendChild(nm);
    const toggles = document.createElement('div');
    toggles.className = 'stack-toggles';
    for (const s of c.sheets) {
      const n = BY_SHEET[s].length;
      const sub = CARD_ALIAS[s] || (s.includes('课后测试') ? '课后测试' : '作业');
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.sheet = s;
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = sub + ' <span class="mono">' + n + '</span>';
      b.addEventListener('click', () => {
        const on = b.classList.toggle('on');
        b.setAttribute('aria-pressed', on);
        bar.classList.toggle('on', bar.querySelectorAll('.chip.on').length > 0);
        updatePickCount();
      });
      toggles.appendChild(b);
    }
    bar.appendChild(label); bar.appendChild(toggles);
    stackEl.appendChild(bar);
  }
  if (store.sheets) {
    for (const b of stackEl.querySelectorAll('.chip')) {
      if (store.sheets.includes(b.dataset.sheet)) {
        b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
        b.closest('.stack-bar').classList.add('on');
      }
    }
  }
  if (store.mode === 'rand') setMode('rand');
  updatePickCount();
  $('wrongCount').textContent = Object.keys(store.wrong).length || '';
}

function selectedSheets() {
  return Array.from(document.querySelectorAll('.chip.on')).map(b => b.dataset.sheet);
}
function updatePickCount() {
  const n = selectedSheets().reduce((s, x) => s + BY_SHEET[x].length, 0);
  $('pickCount').textContent = n;
  $('startBtn').disabled = n === 0;
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modePick button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m));
}
$('modePick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setMode(b.dataset.mode);
});

/* ---------- 出题 ---------- */
function buildQuiz(sheets, shuffle) {
  quiz = [];
  for (const s of sheets) quiz.push(...BY_SHEET[s]);
  if (shuffle) {
    for (let i = quiz.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
    }
  }
}

function startQuiz(sheets, shuffle) {
  buildQuiz(sheets, shuffle);
  if (!quiz.length) { toast('没有题目'); return; }
  pos = 0; correctCount = 0; sessionAnswers = {};
  $('home').classList.add('hidden');
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQuestion();
}

$('startBtn').addEventListener('click', () => {
  const sheets = selectedSheets();
  store.sheets = sheets; store.mode = mode; saveStore();
  startQuiz(sheets, mode === 'rand');
});
$('wrongBookBtn').addEventListener('click', () => {
  const ids = Object.keys(store.wrong);
  if (!ids.length) { toast('还没有错题'); return; }
  const sheets = [...new Set(ids.map(i => i.split('|')[0]))];
  buildQuiz(sheets, false);
  quiz = quiz.filter(q => store.wrong[qid(q)]);
  if (!quiz.length) { toast('没有错题'); return; }
  pos = 0; correctCount = 0; sessionAnswers = {};
  $('home').classList.add('hidden');
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQuestion();
});

/* ---------- 答题 ---------- */
function renderQuestion() {
  const q = quiz[pos];
  judged = false;
  $('quizMeta').textContent = q.sheet;
  $('quizPos').textContent = (pos + 1) + ' / ' + quiz.length;
  $('barFill').style.width = ((pos) / quiz.length * 100) + '%';
  $('qNo').textContent = '第 ' + q.index + ' 题';
  $('qType').textContent = q.type;
  $('qBody').textContent = q.body;
  const optsEl = $('opts');
  optsEl.innerHTML = '';
  if (q.type === '填空题') {
    const n = Array.isArray(q.answer) ? q.answer.length : 0;
    for (let i = 0; i < n; i++) {
      const row = document.createElement('div');
      row.className = 'fill-row';
      const lab = document.createElement('span');
      lab.className = 'fill-label';
      lab.textContent = '填空' + (i + 1);
      const inp = document.createElement('input');
      inp.className = 'fill-input';
      inp.type = 'text';
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.dataset.i = i;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(); });
      row.appendChild(lab); row.appendChild(inp);
      optsEl.appendChild(row);
    }
    optsEl.querySelector('.fill-input').focus();
  } else {
    q.options.forEach((o, i) => {
      const m = o.match(/^([A-Z]+)\.\s*([\s\S]*)$/);
      const key = m ? m[1] : String(i);
      const text = m ? m[2] : o;
      const b = document.createElement('button');
      b.className = 'opt';
      b.dataset.key = key;
      b.innerHTML = '<span class="opt-key">' + key + '</span>' + escapeHtml(text);
      b.addEventListener('click', () => choose(key));
      optsEl.appendChild(b);
    });
  }
  $('feedback').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
  const ex = document.getElementById('explainBox');
  if (ex) ex.remove();
  const hint = document.querySelector('.key-hint');
  hint.textContent = q.type === '填空题'
    ? '输入答案后回车提交 · 再回车下一题'
    : '键盘 1–6 选答 · 回车下一题';
  window.scrollTo(0, 0);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showExplain(q) {
  if (!q.explain) return;
  const div = document.createElement('div');
  div.className = 'explain';
  div.id = 'explainBox';
  div.innerHTML = '<span class="explain-label">解析</span>' + escapeHtml(q.explain);
  const nextRow = $('nextBtn').closest('.next-row');
  nextRow.insertAdjacentElement('beforebegin', div);
}

function finishJudge(ok, wrongMark, correctText) {
  const fb = $('feedback');
  fb.classList.remove('hidden', 'good', 'bad');
  if (ok) {
    correctCount++;
    fb.textContent = '回答正确';
    fb.classList.add('good');
  } else {
    fb.textContent = '回答错误，正确答案：' + correctText;
    fb.classList.add('bad');
    store.wrong[qid(quiz[pos])] = 1;
  }
  saveStore();
  showExplain(quiz[pos]);
  $('barFill').style.width = ((pos + 1) / quiz.length * 100) + '%';
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = pos + 1 < quiz.length ? '下一题' : '查看结果';
}

function choose(key) {
  if (judged) return;
  judged = true;
  const q = quiz[pos];
  sessionAnswers[qid(q)] = key;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.key === q.answer) b.classList.add('right');
  });
  const ok = key === q.answer;
  if (!ok) {
    document.querySelector('.opt[data-key="' + key + '"]').classList.add('wrong');
  }
  finishJudge(ok, null, q.answer);
}

function submitFill() {
  if (judged) return;
  const q = quiz[pos];
  const inputs = document.querySelectorAll('.fill-input');
  if (!inputs.length) return;
  let ok = true;
  const given = [];
  const correct = [];
  inputs.forEach(inp => {
    const i = Number(inp.dataset.i);
    const val = inp.value.trim();
    given.push(val);
    const accepts = Array.isArray(q.answer) ? (q.answer[i] || []) : [];
    correct.push(accepts.join('/'));
    const hit = accepts.some(a => String(a).trim().toLowerCase() === val.toLowerCase());
    inp.disabled = true;
    if (hit) inp.classList.add('right');
    else { ok = false; inp.classList.add('wrong'); }
  });
  judged = true;
  sessionAnswers[qid(q)] = given.join(';');
  finishJudge(ok, null, correct.join('；'));
}

function next() {
  if (!judged) return;
  if (pos + 1 < quiz.length) { pos++; renderQuestion(); }
  else showResult();
}
$('nextBtn').addEventListener('click', next);

/* ---------- 结果 ---------- */
function showResult() {
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  const total = quiz.length;
  const pct = Math.round(correctCount / total * 100);
  $('resultTitle').textContent = '练习完成';
  $('resultPct').textContent = pct + '%';
  $('resultSub').textContent = '答对 ' + correctCount + ' / ' + total + ' 题';
  const wrongQs = quiz.filter(q => store.wrong[qid(q)]);
  const ww = $('wrongListWrap'), wl = $('wrongList');
  if (wrongQs.length) {
    ww.classList.remove('hidden');
    wl.innerHTML = '';
    for (const q of wrongQs) {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = '<span class="mono">' + q.index + '.</span> ' + escapeHtml(q.body) +
        '<br><span class="wb">你的答案 </span><span class="ans-bad">' + escapeHtml(pickedOf(q)) +
        '</span><span class="wb"> · 正确答案 </span><span class="ans-good">' + escapeHtml(q.answer) + '</span>';
      wl.appendChild(div);
    }
  } else {
    ww.classList.add('hidden');
  }
}

function pickedOf(q) {
  return sessionAnswers[qid(q)] || '未作答';
}
$('againBtn').addEventListener('click', () => {
  startQuiz(quiz.length ? [...new Set(quiz.map(q => q.sheet))] : selectedSheets(), mode === 'rand');
});
$('onlyWrongBtn').addEventListener('click', () => {
  const ids = Object.keys(store.wrong);
  if (!ids.length) { toast('没有错题'); return; }
  const sheets = [...new Set(ids.map(i => i.split('|')[0]))];
  buildQuiz(sheets, false);
  quiz = quiz.filter(q => store.wrong[qid(q)]);
  pos = 0; correctCount = 0; sessionAnswers = {};
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQuestion();
});
$('homeBtn').addEventListener('click', goHome);
$('backBtn').addEventListener('click', goHome);

function goHome() {
  $('quiz').classList.add('hidden');
  $('result').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('wrongCount').textContent = Object.keys(store.wrong).length || '';
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  if (!judged && /^[1-6]$/.test(e.key) && e.target.tagName !== 'INPUT') {
    const idx = Number(e.key) - 1;
    const b = document.querySelectorAll('.opt')[idx];
    if (b && !b.disabled) choose(b.dataset.key);
  } else if (e.key === 'Enter' && judged && e.target.tagName !== 'INPUT') {
    next();
  }
});

renderHome();

/* 离线缓存：仅在 http/https 下注册，file:// 打开时自动跳过 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
