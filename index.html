<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="数据通信练习题">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>数据通信与网络 · 练习题</title>
<style>
  :root {
    --bg: #10161F;
    --surface: #182231;
    --surface-2: #1F2C40;
    --border: #2A3850;
    --text: #E8EEF7;
    --muted: #93A3B8;
    --accent: #F2B453;
    --accent-dim: rgba(242, 180, 83, .12);
    --accent-text: #1A1206;
    --good: #4CC38A;
    --good-dim: rgba(76, 195, 138, .12);
    --bad: #E5696B;
    --bad-dim: rgba(229, 105, 107, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s, color .12s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .mono { font-family: Consolas, "JetBrains Mono", ui-monospace, monospace; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .hidden { display: none !important; }

  /* ---------- 首页 ---------- */
  .home-head { margin-bottom: 26px; }
  .home-title {
    font-size: 26px; font-weight: 700; letter-spacing: .02em; margin: 0 0 6px;
  }
  .home-sub { color: var(--muted); font-size: 13px; }
  .stack { margin: 0 0 22px; }
  .stack-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    margin-bottom: 6px;
  }
  .stack-bar.on { border-left-color: var(--accent); }
  .stack-label { display: flex; align-items: baseline; gap: 10px; }
  .stack-chapter { color: var(--muted); font-size: 12px; }
  .stack-chapter .mono { font-size: 12px; }
  .stack-name { font-weight: 600; }
  .stack-toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font-size: 12.5px; padding: 3px 10px; border-radius: 6px;
    color: var(--muted); border-color: var(--border); background: var(--surface-2);
  }
  .chip.on {
    color: var(--accent); border-color: var(--accent); background: var(--accent-dim);
  }
  .chip .mono { font-size: 11.5px; opacity: .8; }
  .mode-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .mode-pick { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-pick button { border: none; border-radius: 0; padding: 8px 18px; color: var(--muted); }
  .mode-pick button + button { border-left: 1px solid var(--border); }
  .mode-pick button.on { color: var(--accent); background: var(--accent-dim); }
  .pick-count { color: var(--muted); font-size: 13px; }
  .pick-count b { color: var(--accent); font-weight: 600; }
  .start-row { display: flex; gap: 12px; }
  .start-btn {
    flex: 1; background: var(--accent); border-color: var(--accent);
    color: var(--accent-text); font-size: 16px; font-weight: 700; padding: 13px;
  }
  .start-btn:hover { filter: brightness(1.06); border-color: var(--accent); }
  .led {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-text); margin-right: 8px; vertical-align: 2px;
    animation: led 2.2s ease-in-out infinite;
  }
  @keyframes led { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .led { animation: none; } }
  .wrong-btn { padding: 13px 18px; }
  .wrong-btn b { color: var(--bad); }

  /* ---------- 答题页 ---------- */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 10px;
  }
  .back-btn { color: var(--muted); font-size: 13px; padding: 5px 10px; }
  .quiz-meta { text-align: center; color: var(--muted); font-size: 12.5px; }
  .quiz-count { text-align: right; color: var(--muted); font-size: 13px; }
  .quiz-count b { color: var(--text); font-weight: 600; }
  .bar-track { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .q-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px 24px;
  }
  .q-index { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .q-index .mono { color: var(--accent); }
  .q-body { font-size: 16px; margin-bottom: 18px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 14.5px;
  }
  .opt .opt-key { color: var(--muted); margin-right: 8px; font-weight: 700; }
  .opt:not(:disabled):hover { border-color: var(--accent); }
  .opt:disabled { opacity: 1; cursor: default; }
  .opt.right { border-color: var(--good); background: var(--good-dim); }
  .opt.right .opt-key { color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-dim); }
  .opt.wrong .opt-key { color: var(--bad); }
  .feedback { margin: 6px 0 14px; font-size: 14px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .explain {
    margin: 0 0 14px; padding: 10px 14px; text-align: left;
    background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--muted);
    line-height: 1.6;
  }
  .explain .explain-label { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .fill-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fill-label { color: var(--muted); font-size: 13px; min-width: 48px; }
  .fill-input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14.5px;
    padding: 9px 12px; font-family: inherit;
  }
  .fill-input:focus { outline: none; border-color: var(--accent); }
  .fill-input.right { border-color: var(--good); background: var(--good-dim); }
  .fill-input.wrong { border-color: var(--bad); background: var(--bad-dim); }
  .next-row { text-align: right; }
  .next-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; min-width: 110px; }
  .key-hint { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: center; }

  /* ---------- 结果页 ---------- */
  .result-head { text-align: center; margin: 18px 0 8px; }
  .result-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .result-score { margin: 10px 0 26px; text-align: center; }
  .result-score .big { font-size: 44px; font-weight: 700; color: var(--accent); }
  .result-score .sub { color: var(--muted); font-size: 13px; }
  .wrong-list { margin-bottom: 26px; }
  .wrong-title { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .wrong-item {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--bad);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px;
  }
  .wrong-item .wb { color: var(--muted); }
  .wrong-item .ans-bad { color: var(--bad); font-weight: 600; }
  .wrong-item .ans-good { color: var(--good); font-weight: 600; }
  .result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .result-btns .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 18px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 560px) {
    .stack-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    .stack-toggles { justify-content: flex-start; }
    .q-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- 首页：选题 -->
  <section id="home">
    <header class="home-head">
      <h1 class="home-title">数据通信与网络 · 练习题</h1>
      <div class="home-sub">雨课堂题库导出 · 共 <span id="totalCount" class="mono"></span> 题 · 进度保存在本机</div>
    </header>

    <div class="stack" id="stack"></div>

    <div class="mode-row">
      <div class="mode-pick" id="modePick">
        <button data-mode="seq" class="on">顺序</button>
        <button data-mode="rand">随机</button>
      </div>
      <div class="pick-count">已选 <b id="pickCount" class="mono">0</b> 题</div>
    </div>

    <div class="start-row">
      <button class="start-btn" id="startBtn" disabled><span class="led"></span>开始练习</button>
      <button class="wrong-btn" id="wrongBookBtn">错题本 <b id="wrongCount" class="mono"></b></button>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="hidden">
    <div class="quiz-top">
      <button class="back-btn" id="backBtn">← 返回选题</button>
      <div class="quiz-meta" id="quizMeta"></div>
      <div class="quiz-count"><b id="quizPos" class="mono"></b></div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="q-card">
      <div class="q-index"><span class="mono" id="qNo"></span> · <span id="qType"></span></div>
      <div class="q-body" id="qBody"></div>
      <div id="opts"></div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="next-row"><button class="next-btn hidden" id="nextBtn">下一题</button></div>
      <div class="key-hint">键盘 1–6 选答 · 回车下一题</div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="hidden">
    <div class="result-head"><div class="result-title" id="resultTitle"></div></div>
    <div class="result-score">
      <div class="big mono" id="resultPct"></div>
      <div class="sub" id="resultSub"></div>
    </div>
    <div class="wrong-list hidden" id="wrongListWrap">
      <p class="wrong-title">错题回顾</p>
      <div id="wrongList"></div>
    </div>
    <div class="result-btns">
      <button class="primary" id="againBtn">再练一遍</button>
      <button id="onlyWrongBtn">只练错题</button>
      <button id="homeBtn">返回选题</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
const DATA = [{"sheet": "第1章概述作业", "index": 1, "type": "单选题", "body": "世界上第一个计算机网络是( )", "options": ["A. ARPANET", "B. ChinaNet", "C. Internet", "D. CERNET"], "answer": "A", "explain": "ARPANET 是 1969 年美国国防部建成的第一个分组交换网，被视为因特网的前身。"}, {"sheet": "第1章概述作业", "index": 2, "type": "单选题", "body": "一般来说,用户上网要通过因特网服务提供商,其英文缩写为( )", "options": ["A. IDC", "B. ICP", "C. ASP", "D. ISP"], "answer": "D", "explain": "ISP 即因特网服务提供商，用户上网需通过 ISP 接入因特网。"}, {"sheet": "第1章概述作业", "index": 3, "type": "单选题", "body": "IP电话使用的数据交换技术是( )", "options": ["A. 电路交换", "B. 报文交换", "C. 分组交换", "D. 包交换"], "answer": "C", "explain": "IP 电话把话音数据分成小分组传送，属于分组交换。"}, {"sheet": "第1章概述作业", "index": 4, "type": "单选题", "body": "电话交换系统采用的是()技术", "options": ["A. 电路交换", "B. 报文交换", "C. 分组交换", "D. 信号交换"], "answer": "A", "explain": "传统电话通话前建立专用物理通路，属于电路交换。"}, {"sheet": "第1章概述作业", "index": 5, "type": "单选题", "body": "以下各项中,不是分组交换特点的是( )", "options": ["A. 每个分组自身携带有足够的信息,它的传送是被单独处理的", "B. 不需要事先建立连接", "C. 所有分组按顺序到达目的端系统", "D. 网络节点要为每个分组做出路由选择"], "answer": "C", "explain": "分组可能沿不同路径到达目的地，不保证按序，因此 C 不是分组交换的特点。"}, {"sheet": "第1章概述作业", "index": 6, "type": "单选题", "body": "下列交换技术中,节点不采用“存储—转发”方式的是() 。", "options": ["A. 电路交换技术", "B. 报文交换技术", "C. 虚电路交换技术", "D. 数据报交换技术"], "answer": "A", "explain": "电路交换建立专用通路后节点直接转发，不采用存储转发方式。"}, {"sheet": "第1章概述作业", "index": 7, "type": "单选题", "body": "将传输比特流划分为帧,应属于下列OSI 的哪一层处理?()", "options": ["A. 物理层", "B. 数据链路层", "C. 传输层", "D. 网络层"], "answer": "B", "explain": "成帧（把比特流划分为帧）是数据链路层的功能。"}, {"sheet": "第1章概述作业", "index": 8, "type": "单选题", "body": "两端用户传输文件,应属于下列OSI的哪一层处理?( )", "options": ["A. 表示层", "B. 会话层", "C. 传输层", "D. 应用层"], "answer": "D", "explain": "文件传输是面向用户的网络应用，属于应用层。"}, {"sheet": "第1章概述作业", "index": 9, "type": "单选题", "body": "在OSI模型中,一个层N与它的上层(第N+1层)的关系是什么?( )", "options": ["A. 第N层为第N+1层提供服务。", "B. 第N+1层把从第N层接收到的信息添一个报头。", "C. 第N层使用第N+1层提供的服务。", "D. 第N层与第N+1层相互没有影响。"], "answer": "A", "explain": "OSI 中第 N 层为第 N+1 层提供服务，上层使用下层服务。"}, {"sheet": "第1章概述作业", "index": 10, "type": "单选题", "body": "在OSI层次体系结构中,实际的通信是在()实体间进行的.", "options": ["A. 物理层", "B. 数据链路层", "C. 网络层", "D. 传输层"], "answer": "A", "explain": "只有物理层存在真实物理连接，实际通信在物理层实体间进行。"}, {"sheet": "第1章概述作业", "index": 11, "type": "单选题", "body": "OSI/RM 模型中,哪个层次用来在设备的进程间传递报文?( )", "options": ["A. 网络层", "B. 传输层", "C. 会话层", "D. 表示层"], "answer": "B", "explain": "传输层负责端到端进程间通信，在设备进程间传递报文。"}, {"sheet": "第1章概述作业", "index": 12, "type": "单选题", "body": "TCP/IP协议是Internet中计算机之间通信所必须共同遵循的一种( )。", "options": ["A. 信息资源", "B. 通信规定", "C. 软件", "D. 硬件"], "answer": "B", "explain": "TCP/IP 协议是计算机间通信必须共同遵循的通信规则。"}, {"sheet": "第1章概述作业", "index": 13, "type": "单选题", "body": "在OSI环境中,不同开放系统对等实体之间的通信,需要N层实体向相邻的上一层N+1层实体提供一种能力,这种能力称为( )", "options": ["A. 协议", "B. 服务", "C. 用户", "D. 功能"], "answer": "B", "explain": "N 层向 N+1 层提供的能力称为服务，服务是层间垂直接口。"}, {"sheet": "第1章概述作业", "index": 14, "type": "单选题", "body": "协议是( ) 之间进行通信的规则或约定。", "options": ["A. 同一结点上下层", "B. 不同结点", "C. 相邻实体", "D. 不同结点对等实体"], "answer": "D", "explain": "协议是不同结点对等实体之间通信的规则或约定。"}, {"sheet": "第1章概述作业", "index": 15, "type": "单选题", "body": "在TCP/IP协议簇中,( ) 属于自上而下的第二层。", "options": ["A. ICMP", "B. SNMP", "C. UDP", "D. IP"], "answer": "C", "explain": "TCP/IP 自上而下第二层是运输层，UDP 属于运输层。"}, {"sheet": "第1章概述作业", "index": 16, "type": "单选题", "body": "数据解封装的过程是( )", "options": ["A. 段—包—帧—流—数据", "B. 流—帧—包—段—数据", "C. 数据—包—段—帧—流", "D. 数据—段—包—帧—流"], "answer": "B", "explain": "解封装是封装逆过程：比特流→帧→包→段→数据。"}, {"sheet": "第1章概述作业", "index": 17, "type": "单选题", "body": "RFC是下列哪一个英文短语的缩写( )", "options": ["A. Reference For Computers", "B. Request For Comment", "C. Registration Function Citation", "D. Renewal Form Catalogue"], "answer": "B", "explain": "RFC 全称 Request For Comments，是互联网技术文档。"}, {"sheet": "第1章概述作业", "index": 18, "type": "单选题", "body": "按照OSI参考模型分层,其第2层,第4层分别为( )", "options": ["A. 数据链路层,网络层", "B. 数据链路层, 传输层", "C. 网络层,会话层", "D. 数据链路层,会话层"], "answer": "B", "explain": "OSI 第 2 层是数据链路层，第 4 层是传输层。"}, {"sheet": "第1章概述作业", "index": 19, "type": "单选题", "body": "下列哪个协议不是TCP/IP的应用层协议?( )", "options": ["A. TELNET" 数据链路层", "B. 会话层", "C. 应用层", "D. 网络层"], "answer": "B", "explain": "OSI 运输层之上是会话层。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 16, "type": "单选题", "body": "在TCP/IP 体系结构中,网际层的相邻下层为( )。", "options": ["A. 数据链路层", "B. 网络接口层", "C. 运输层", "D. 应用层"], "answer": "B", "explain": "TCP/IP 网际层之下是网络接口层。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 17, "type": "单选题", "body": "在 TCP/IP 参考模型中,运输层的相邻下层实现的主要功能是( )。", "options": ["A. 对话管理", "B. 数据格式转换", "C. 可靠数据传输", "D. IP数据报在多个网络间的传输"], "answer": "D", "explain": "运输层相邻下层是网际层，主要功能是 IP 数据报在多个网络间的传输。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 18, "type": "单选题", "body": "在OSI 参考模型中,控制两个对等实体进行逻辑通信的规则的集合称为( )。", "options": ["A. 实体", "B. 协议", "C. 服务", "D. 对等实体"], "answer": "B", "explain": "控制对等实体逻辑通信的规则集合称为协议。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 19, "type": "单选题", "body": "在 OSI 参考模型中,第 n 层与它之上的第 n+1 层的关系是( )。", "options": ["A. 第 n 层为第 n+1 层提供服务", "B. 第 n+1 层为从第 n 层接收的报文添加一个报头", "C. 第 n 层使用第 n+1 层提供的服务", "D. 第 n 层和第 n+1 层相互没有影响"], "answer": "A", "explain": "第 n 层为第 n+1 层提供服务，是 OSI 的层间关系。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 20, "type": "单选题", "body": "在 OSI 参考模型中,对等实体是指( )。", "options": ["A. 任何可发送或接收信息的硬件", "B. 任何可发送或接收信息的软件进程", "C. 收发双方相同层次中的实体", "D. 收发双方不同层次中的实体"], "answer": "C", "explain": "对等实体是收发双方相同层次中的实体。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 21, "type": "单选题", "body": "TCP 通信双方在基于 TCP 连接进行通信之前,首先要通过“三报文握手”来建立TCP 连接,这属于网络协议三要素中的( )。", "options": ["A. 语法", "B. 语义", "C. 同步", "D. 透明"], "answer": "C", "explain": "三报文握手规定通信时序，属于协议三要素中的同步。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 22, "type": "单选题", "body": "IP 数据报的首部格式属于网络协议三要素中的( )。", "options": ["A. 语法", "B. 语义", "C. 同步", "D. 透明"], "answer": "A", "explain": "IP 数据报首部格式规定字段结构，属于语法要素。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 23, "type": "单选题", "body": "在数据从源主机传送至目的主机的过程中,不参与数据封装工作的是( )。", "options": ["A. 数据链路层", "B. 会话层", "C. 应用层", "D. 物理层"], "answer": "D", "explain": "物理层只传比特流，不参与数据封装。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 24, "type": "单选题", "body": "物理层、数据链路层、网络层、运输层的传输单位(或称协议数据单元 PDU)分别是( )。I.帧 II. 比特 III. 报文段 IV. 分组(数据报)", "options": ["A. I、II、IV、III", "B. II、I、IV、III", "C. I、IV、II、III", "D. III、IV、II、I"], "answer": "B", "explain": "物理层比特、数据链路层帧、网络层分组、运输层报文段。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 25, "type": "单选题", "body": "假设有 500B 的数据待发送(无拆分),需要经过 OSI 参考模型的逐层封装,除物理层外,其他各层在封装 PDU 时均引入 20B 的额外开销,则数据传输效率约为( )。", "options": ["A. 78", "B. 81", "C. 88", "D. 92"], "answer": "B", "explain": "除物理层外 6 层各加 20B 开销共 620B，效率 500/620≈81%。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 26, "type": "单选题", "body": "在 OSI 参考模型中,自下而上第一个提供端到端服务的层次是( )。", "options": ["A. 数据链路层", "B. 传输层", "C. 会话层", "D. 应用层"], "answer": "B", "explain": "传输层是自下而上第一个提供端到端服务的层次。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 27, "type": "单选题", "body": "下列选项中,不属于网络体系结构所描述的内容是( )。", "options": ["A. 网络的层次", "B. 每一层使用的协议", "C. 协议的内部实现细节", "D. 每一层必须完成的功能"], "answer": "C", "explain": "体系结构描述层次、协议和功能，不涉及协议内部实现细节。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 28, "type": "单选题", "body": "主机甲通过 1 个路由器(存储转发方式)与主机乙互联,两段链路的数据传输速率均为 10Mbps,主机甲分别采用报文交换和分组大小为 10kb 的分组交换向主机乙发送 1 个大小为 8 Mb(1M=[则自])的报文。若忽略链路传播延迟、分组头开销和分组拆装时间,则两种交换方式完成该报文传输所需的总时间分别为( )。", "options": ["A. 800ms、1600ms", "B. 801ms、1600ms", "C. 1600ms、800ms", "D. 1600ms、801ms"], "answer": "D", "explain": "报文交换需完整收下再转发，用时为两段发送时延之和；分组交换可流水转发，约省一个报文发送时延。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 29, "type": "单选题", "body": "在 OSI 参考模型中,直接为会话层提供服务的是( )。", "options": ["A. 应用层", "B. 表示层", "C. 传输层", "D. 网络层"], "answer": "C", "explain": "会话层的直接下层是传输层，由传输层提供服务。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 30, "type": "单选题", "body": "假设 OSI 参考模型的应用层欲发送 400B 的数据(无拆分),除物理层和应用层之外,其他各层在封装 PDU 时均引入 20B 的额外开销,则应用层数据传输效率约为( )。", "options": ["A. 80%", "B. 83%", "C. 87%", "D. 91%"], "answer": "A", "explain": "除物理层和应用层外 5 层各加 20B，总开销 100B，效率 400/500=80%。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 31, "type": "单选题", "body": "如图所描述的协议要素是( )。[则自]题31 图I、语法 II、语义 III、时序", "options": ["A. 仅 I", "B. 仅 II", "C. 仅 III", "D. I、II 和 III"], "answer": "C", "explain": "图描述的是报文交换的时间顺序，属于时序（同步）要素。"}, {"sheet": "第1章 概述 课后测试题-2404211", "index": 32, "type": "单选题", "body": "在 TCP/IP 参考模型中,由传输层相邻的下一层实现的主要功能是( )。", "options": ["A. 对话管理", "B. 路由选择", "C. 端到端报文段传输", "D. 节点到节点流量控制"], "answer": "B", "explain": "运输层相邻下一层是网际层，其主要功能是路由选择。"}, {"sheet": "第2章物理层作业", "index": 1, "type": "单选题", "body": "收音机的信号传输属于()", "options": ["A. 单工", "B. 半双工", "C. 全双工"], "answer": "A", "explain": "收音机只能接收不能发送，属于单工通信。"}, {"sheet": "第2章物理层作业", "index": 2, "type": "单选题", "body": "多根光纤复用在一根主干光纤中, 该种多路复用方法称为() 多路复用。", "options": ["A. 时分", "B. 频分", "C. 波分", "D. 码分"], "answer": "C", "explain": "多根光纤复用在主干光纤上，用不同波长区分各路信号，称为波分复用。"}, {"sheet": "第2章物理层作业", "index": 3, "type": "单选题", "body": "相邻层间交换的数据单元称之为服务数据单元,其英文缩写为()。", "options": ["A. SDU", "B. IDU", "C. PDU", "D. ICI"], "answer": "A", "explain": "相邻层间交换的数据单元是服务数据单元，英文缩写 SDU。"}, {"sheet": "第2章物理层作业", "index": 4, "type": "单选题", "body": "奈奎斯特定理描述了有限带宽、无噪声信道的最大数据传输速率与信道带宽的关系。对于二进制数据,若信道带宽B= 3000Hz,则最大数据传输速率为()", "options": ["A. 300bit/s", "B. 3000bit/s", "C. 6000bit/s", "D. 2400bit/s"], "answer": "C", "explain": "奈氏准则：无噪声二进制信道最大速率=2×带宽=2×3000=6000bit/s。"}, {"sheet": "第2章物理层作业", "index": 5, "type": "单选题", "body": "常用的数据传输速率单位有Kbit/s、Mbit/s、Gbit/s。1Gbit/s等于()。", "options": ["A. 1000Mb/s", "B. 1000Kb/s", "C. 1000000Mb/s", "D. [李首]kb/s"], "answer": "A", "explain": "1Gbit/s=1000Mbit/s=1000Mb/s。"}, {"sheet": "第2章物理层作业", "index": 6, "type": "单选题", "body": "香农定理描述了信道的最大传输速率与哪些(个)参数之间的关系( )。 I .信道带宽 II .信噪比 III.噪声功率", "options": ["A. I和III", "B. I和II", "C. 仅I", "D. 仅II"], "answer": "B", "explain": "香农定理给出最大速率与信道带宽和信噪比的关系。"}, {"sheet": "第2章物理层作业", "index": 7, "type": "单选题", "body": "通信信道的每一端可以是发送端,也可以是接收端,信息可由这一端传输到另一端,也可以从那一端传输到这一端,在同一时刻,信息可以每一端进行收发的通信方式为( )", "options": ["A. 单工通信", "B. 半双工", "C. 全双工", "D. 模拟"], "answer": "C", "explain": "同一时刻两端可同时收发的通信方式是全双工。"}, {"sheet": "第2章物理层作业", "index": 8, "type": "单选题", "body": "在同一个信道上的同一时刻,能够进行双向数据传送的通信方式是()。", "options": ["A. 单工", "B. 半双工", "C. 全双工", "D. 上述三种均不是"], "answer": "C", "explain": "同一信道同一时刻能双向传送的是全双工通信。"}, {"sheet": "第2章物理层作业", "index": 9, "type": "单选题", "body": "在以下传输介质中,带宽最宽,抗干扰能力最强的是( )", "options": ["A. 双绞线", "B. 无线信道", "C. 同轴电缆", "D. 光纤"], "answer": "D", "explain": "光纤带宽最宽、抗干扰能力最强。"}, {"sheet": "第2章物理层作业", "index": 10, "type": "单选题", "body": "当数据由计算机A传送至计算机B时,不参与数据封装工作的是( )", "options": ["A. 物理层", "B. 数据链路层", "C. 应用层", "D. 网络层"], "answer": "A", "explain": "物理层只传比特流，不参与封装。"}, {"sheet": "第2章物理层作业", "index": 11, "type": "单选题", "body": "双绞线由两根具有绝缘保护层的铜导线按一定密度互相绞在一起组成,这样可以( )。", "options": ["A. 降低信号干扰的程度", "B. 降低成本", "C. 提高传输速度", "D. 没有任何作用"], "answer": "A", "explain": "双绞线绞合可抵消外界电磁干扰，降低信号干扰程度。"}, {"sheet": "第2章物理层作业", "index": 12, "type": "单选题", "body": "在下列传输介质中,哪种传输介质的抗电磁干扰性最好?( )", "options": ["A. 双绞线", "B. 同轴电缆", "C. 光缆", "D. 无线介质"], "answer": "C", "explain": "光缆传输光信号，抗电磁干扰性最好。"}, {"sheet": "第2章物理层作业", "index": 13, "type": "单选题", "body": "采用半双工通信方式,数据传输的方向为( )", "options": ["A. 可以在两个方向上同时传输", "B. 只能在一个方向上传输", "C. 可以在两个方向上传输,但不能同时进行", "D. 以上均不对"], "answer": "C", "explain": "半双工可双向传输，但同一时刻只能一个方向。"}, {"sheet": "第2章物理层作业", "index": 14, "type": "单选题", "body": "采用全双工通信方式,数据传输的方向为( )", "options": ["A. 可以在两个方向上同时传输", "B. 只能在一个方向上传输", "C. 可以在两个方向上传输,但不能同时进行", "D. 以上均不对"], "answer": "A", "explain": "全双工可在两个方向上同时传输。"}, {"sheet": "第2章物理层作业", "index": 15, "type": "单选题", "body": "下面接入方式中哪种传输速率最快( ) 。", "options": ["A. 电话拨号", "B. DDN专线", "C. ADSL", "D. 光纤同轴混合(HFC)", "E. 光纤接入", "F. 无线接入"], "answer": "E", "explain": "光纤接入速率最快，远超拨号、DDN、ADSL、HFC 和无线接入。"}, {"sheet": "第2章物理层作业", "index": 16, "type": "单选题", "body": "下列哪一个关于信道的描述是错误的?( )", "options": ["A. 模拟信道主要用于传送模拟信号", "B. 数字信道主要用于传送数字信号", "C. 数字信号在经过数模变换后就可以在模拟信道上传送", "D. 模拟信号不可能在数字信道上传送。"], "answer": "D", "explain": "模拟信号经 PCM 编码数字化后可在数字信道上传送，D 说法错误。"}, {"sheet": "第2章物理层作业", "index": 17, "type": "单选题", "body": "采用1200bps的同步传输时,若每帧含56位同步信息、48位控制位和4096位数据位,那么传 输1024个字节需要( )秒。", "options": ["A. 7", "B. 5", "C. 10", "D. 15"], "answer": "A", "explain": "每帧 56+48+4096=4200bit，1024 字节=8192bit 需约 2 帧，2×4200/1200=7s。"}, {"sheet": "第2章物理层作业", "index": 18, "type": "单选题", "body": "有噪声信道的最大数据传输速率( )", "options": ["A. 与信号功率成正比", "B. 与带宽成正比", "C. 与信噪比S/N+1成正比", "D. 与噪声功率成反比"], "answer": "B", "explain": "香农公式 C=B·log₂(1+S/N)，最大速率与带宽成正比。"}, {"sheet": "第2章物理层作业", "index": 19, "type": "单选题", "body": "请判断下述中正确的是（ ）", "options": ["A. 时分多路复用是将物理信道的总带宽分割成若干个子信道，该物理信道同时传输各子信道的信号；", "B. 虚电路传输方式类似于邮政信箱服务，数据报服务类似于长途电话服务；", "C. 多路复用的方法中，从性质上来说，频分多路复用较适用于模拟信号传输，而时分多路复用较适用于数字信号传输；", "D. 即使采用数字通信方式，也还需要同模拟通信方式一样，必须使用调制解调器。"], "answer": "C", "explain": "频分复用适合模拟信号，时分复用适合数字信号，这是二者的典型适用场景。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 1, "type": "单选题", "body": "下列选项中,不属于物理层接口规范定义范畴的是( ) 。", "options": ["A. 引脚功能", "B. 接口形状", "C. 信号电平", "D. 传输媒体"], "answer": "D", "explain": "传输媒体本身不在物理层接口规范定义范畴内。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 2, "type": "单选题", "body": "某网络在物理层规定,信号的电平范围为-15V~+15V,电线长度限于15m以内, 这体现了物理层接口的( ) 。", "options": ["A. 机械特性", "B. 功能特性", "C. 电气特性", "D. 过程特性"], "answer": "C", "explain": "电平范围、传输距离限制属于物理层接口的电气特性。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 3, "type": "单选题", "body": "当描述一个物理层接口引脚处于高电平时的含义时,该描述属于( )。", "options": ["A. 机械特性", "B. 电气特性", "C. 功能特性", "D. 过程特性"], "answer": "C", "explain": "引脚电平的含义（功能定义）属于功能特性。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 4, "type": "单选题", "body": "双绞线是用两个绝缘导线绞合而成的,绞合的目的是( )。", "options": ["A. 减少干扰", "B. 提高传输速度", "C. 增大传输距离", "D. 增大抗拉强度"], "answer": "A", "explain": "双绞线绞合目的是抵消干扰，减少串扰。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 5, "type": "单选题", "body": "在电缆中采用屏蔽技术带来的好处主要是( )。", "options": ["A. 减少信号衰减", "B. 减少电磁干扰辐射", "C. 减少物理损坏", "D. 减少电缆的阻抗"], "answer": "B", "explain": "屏蔽层主要减少电磁干扰的辐射与串入。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 6, "type": "单选题", "body": "不受电磁干扰和噪声影响的传输介质是( )。", "options": ["A. 屏蔽双绞线", "B. 非屏蔽双绞线", "C. 光纤", "D. 同轴电缆"], "answer": "C", "explain": "光纤传光信号，不受电磁干扰和噪声影响。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 7, "type": "单选题", "body": "多模光纤传输光信号的原理是( ) 。", "options": ["A. 光的折射特性", "B. 光的发射特性", "C. 光的全反射特性", "D. 光的绕射特性"], "answer": "C", "explain": "多模光纤利用光在纤芯界面的全反射传输光信号。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 8, "type": "单选题", "body": "以下关于单模光纤的说法中, 正确的是( )。", "options": ["A. 光纤越粗, 数据传输率越高", "B. 如果光纤的直径减小到只有光的一个波长大小,那么光沿直线传播", "C. 光源是发光二极管或激光", "D. 接收器是光电二极管或激光检波器"], "answer": "B", "explain": "光纤直径减到约一个波长时，光近似沿直线传播，即单模光纤。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 9, "type": "单选题", "body": "被用于计算机内部数据传输的是( )。", "options": ["A. 串行传输", "B. 并行传输", "C. 同步传输", "D. 异步传输"], "answer": "B", "explain": "计算机内部数据总线多位并行传输，采用并行传输。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 10, "type": "单选题", "body": "对讲机的通信方式属于( )。", "options": ["A. 单向通信", "B. 双向交替通信", "C. 双向同时通信", "D. 并行通信"], "answer": "B", "explain": "对讲机同一时刻只能一方说话，属于双向交替通信（半双工）。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 11, "type": "单选题", "body": "下列有关曼彻斯特编码的叙述,正确的是( )。", "options": ["A. 每个信号起始边界作为时钟信号有利于同步", "B. 将时钟与数据取值都包含在信号中", "C. 这种模拟信号的编码机制特别适用于传输声音", "D. 每位的中间不跳变表示信号的取值为 0"], "answer": "B", "explain": "曼彻斯特编码把时钟和数据都包含在信号中，每比特中间都跳变。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 12, "type": "单选题", "body": "图 2-12是采用曼彻斯特编码的某个信号波形,其表示的比特串为( )。[像领] 习题2-12 图", "options": ["A. 11011010", "B. 11011100", "C. 00100111", "D. 00101100"], "answer": "B", "explain": "曼彻斯特编码中间跳变方向定值：高到低为 1、低到高为 0，波形对应 11011100。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 13, "type": "单选题", "body": "不含同步信息的编码是( )。I.不归零编码 II. 曼彻斯特编码 III. 差分曼彻斯特编码", "options": ["A. 仅 I", "B. 仅 II", "C. 仅 II 和 III", "D. I、 II、 III"], "answer": "A", "explain": "不归零编码没有跳变可提取时钟，不含同步信息。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 14, "type": "单选题", "body": "某信道的波特率为 1000Baud,若令其数据传输率达到 4kb/s,则一个码元所取的有 效离散值个数为( ) 。", "options": ["A. 2", "B. 4", "C. 8", "D. 16"], "answer": "D", "explain": "4kb/s=1000Baud×log₂N，得 N=16 种离散值。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 15, "type": "单选题", "body": "已知某信道的数据传输速率为 64kb/s,一个载波信号码元有 4 个有效离散值,则该 信道的波特率为( ) 。", "options": ["A. 16kBaud", "B. 32kBaud", "C. 64kBaud", "D. 128kBaud"], "answer": "B", "explain": "波特率=比特率÷log₂4=64k÷2=32kBaud。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 16, "type": "单选题", "body": "若某通信链路的数据传输率为4800b/s,采用8相位调制,则该链路的波特率是( )。", "options": ["A. 600Baud", "B. 1200Baud", "C. 1600Baud", "D. 3200Baud"], "answer": "C", "explain": "8 相位每码元 3bit，波特率=4800÷3=1600Baud。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 17, "type": "单选题", "body": "采用 8 种相位,每种相位各有两种幅度的 QAM调制方法,在 1200Baud 的信号传 输速率下能达到的数据传输率为( )。", "options": ["A. 2400b/s", "B. 3600b/s", "C. 4800b/s", "D. 9600b/s"], "answer": "C", "explain": "8 相位×2 幅度=16 种状态，每码元 4bit，1200×4=4800b/s。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 18, "type": "单选题", "body": "某种调制技术的星座图如图2-18所示。若其波特率达到1200Baud 时,则比特率 为( ) [像领] 习题2-18 图", "options": ["A. 1200 比特/秒", "B. 2400 比特/秒", "C. 4800 比特/秒", "D. 9600 比特/秒"], "answer": "C", "explain": "星座图 16 点，每码元 4bit，1200×4=4800b/s。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 19, "type": "单选题", "body": "影响信道最大传输速率的因素主要有( ) 。", "options": ["A. 信道带宽和信噪比", "B. 码元传输速率和噪声功率", "C. 频率特性和带宽", "D. 发送功率和噪声功率"], "answer": "A", "explain": "信道最大速率主要由带宽和信噪比决定（奈氏与香农）。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 20, "type": "单选题", "body": "对于某带宽为 4000Hz 的低通信道,采用 16 种不同的物理状态来表示数据。按照 奈氏准则,信道的最大数据传输速率是( ) 。", "options": ["A. 4kb/s", "B. 8kb/s", "C. 16kb/s", "D. 32kb/s"], "answer": "D", "explain": "奈氏准则：2×4000×log₂16=32kb/s。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 21, "type": "单选题", "body": "电话系统的典型参数是信道带宽为3000Hz,信噪比为 30dB,则该系统的最大数据 传输率为( ) 。", "options": ["A. 3kb/s", "B. 6kb/s", "C. 30kb/s", "D. 64kb/s"], "answer": "C", "explain": "香农公式：30dB=1000 倍，3000×log₂(1+1000)≈30kb/s。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 22, "type": "单选题", "body": "在无噪声情况下,若某通信链路的带宽为 4kHz,采用 8个相位的调制技术,则该 通信链路的最大数据传输速率是( ) 。", "options": ["A. 12kbps", "B. 24kbps", "C. 48kbps", "D. 96kbps"], "answer": "B", "explain": "无噪声用奈氏准则：2×4k×log₂8=24kbps。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 23, "type": "单选题", "body": "若链路的频率带宽为 4kHz,信噪比为 30dB,则该链路的理论最大数据传输速率是 ()。", "options": ["A. 40kbps", "B. 80kbps", "C. 120kbps", "D. 160kbps"], "answer": "A", "explain": "香农公式：4k×log₂(1+1000)≈40kbps。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 24, "type": "单选题", "body": "将物理信道的总频带宽分割成若干个子信道,每个子信道传输一路信号,这种信道 复用技术是( )。", "options": ["A. 码分复用", "B. 频分复用", "C. 时分复用", "D. 空分复用"], "answer": "B", "explain": "把总频带分割成子信道、每路占一段频带，是频分复用。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 25, "type": "单选题", "body": "共有3个站进行CDMA 通信,其中 A站的码片序列为(-1 -1 -1 +1 +1 -1 +1 +1),B站的码片序列为(-1 -1 +1 -1 +1 +1 +1 -1),则C站的码片序列为( )。", "options": ["A. (+1 +1 +1 -1 -1 +1 -1 -1)", "B. (+1 +1 -1 +1 -1 -1 -1 +1)", "C. (-1 -1 +1 -1 -1 +1 -1 -1)", "D. (-1 +1 -1 +1 +1 +1 -1 -1)"], "answer": "D", "explain": "CDMA 中三站码片需两两正交，验证内积为 0 可得 C 站序列。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 26, "type": "单选题", "body": "站点 A、 B、 C 通过 CDMA 共享链路, A、 B、 C 的码片序列分别是(1,1,1,1)、(1,-1,1-1) 和(1,1,-1,-1)。若 A从链路上收到的序列是(0,2,-2,0,0,-2,0,-2,2,0,2,0,),则A收到B 发送的数据是( ) 。", "options": ["A. 000", "B. 011", "C. 111", "D. 110"], "answer": "B", "explain": "用 A 的码片与收到的叠加序列逐段做内积，解出 B 发送的比特 011。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 27, "type": "单选题", "body": "在无噪声情况下,若某通信链路的带宽为 3kHz,采用 4 个相位,每个相位具有 4 种振幅的 QAM 调制技术, 则该通信链路的最大数据传输速率是( ) 。", "options": ["A. 12kbps", "B. 24kbps", "C. 48kbps", "D. 96kbps"], "answer": "B", "explain": "4 相位×4 振幅=16 状态，无噪声奈氏：2×3k×4=24kbps。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 28, "type": "单选题", "body": "若某通信链路的数据传输速率为 2400bps,采用4相位调制,则该链路的波特率是( ) 。", "options": ["A. 600 波特", "B. 1200波特", "C. 4800波特", "D. 9600波特"], "answer": "B", "explain": "4 相位每码元 2bit，波特率=2400÷2=1200 波特。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 29, "type": "单选题", "body": "下列因素中,不会影响信道数据传输速率的是( ) 。", "options": ["A. 信噪比", "B. 频率带宽", "C. 调制速度", "D. 信号传播速度"], "answer": "D", "explain": "信号传播速度影响传播时延，不影响信道数据传输速率。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 30, "type": "单选题", "body": "若某链路的频率带宽为 8 kHz,信噪比为 30 dB,该链路实际数据传输速率约为理论最大数据传输速率的 50%,则该链路的实际数据传输速率约是( ) 。", "options": ["A. 8kbps", "B. 20kbps", "C. 40kbps", "D. 80kbps"], "answer": "C", "explain": "香农公式：8k×log₂(1+1000)≈80kbps，实际取 50% 约 40kbps。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 31, "type": "单选题", "body": "若信道在无噪声情况下的极限数据传输速率不小于信噪比为30dB条件下的极限数据传输速率,则信号状态数至少是( ) 。", "options": ["A. 4", "B. 8", "C. 16", "D. 32"], "answer": "D", "explain": "令 2B·log₂N≥B·log₂(1+1000)，得 log₂N≥约 5，N 至少 32。"}, {"sheet": "第2章 物理层 课后测试题-2404211", "index": 32, "type": "单选题", "body": "若图2- 32为一段差分曼彻斯特编码信号波形,则其编码的二进制位串是( ) 。[像领] 习题2-32 图", "options": ["A. 1011 1001", "B. 1101 0001", "C. 0010 1110", "D. 1011 0110"], "answer": "A", "explain": "差分曼彻斯特看相邻码元边界是否跳变，解得 10111001。"}, {"sheet": "第3章作业", "index": 1, "type": "单选题", "body": "以下属于物理层的设备是()", "options": ["A. 中继器", "B. 以太网交换机", "C. 桥", "D. 网关"], "answer": "A", "explain": "中继器只再生信号，工作在物理层。"}, {"sheet": "第3章作业", "index": 2, "type": "单选题", "body": "下面哪种LAN 是应用CSMA/CD协议的()", "options": ["A. 令牌环", "B. FDDI", "C. ETHERNET", "D. NOVELL"], "answer": "C", "explain": "以太网（Ethernet）采用 CSMA/CD 协议。"}, {"sheet": "第3章作业", "index": 3, "type": "单选题", "body": "在OSI的七层参考模型中,工作在第三层以上的网间连接设备是()。", "options": ["A. 集线器", "B. 网关", "C. 网桥", "D. 中继器"], "answer": "B", "explain": "网关工作在第三层以上（高层），集线器在物理层、网桥在链路层。"}, {"sheet": "第3章作业", "index": 4, "type": "单选题", "body": "以太网媒体访问控制技术CSMA/CD的机制是()。", "options": ["A. 争用带宽", "B. 预约带宽", "C. 循环使用带宽", "D. 按优先级分配带宽"], "answer": "A", "explain": "CSMA/CD 各站点争用信道，机制是争用带宽。"}, {"sheet": "第3章作业", "index": 5, "type": "单选题", "body": "以下关于100BASE-T的描述中错误的是()。", "options": ["A. 数据传输速率为100Mbit/S", "B. 信号类型为基带信号", "C. 采用5 类UTP,其最大传输距离为185m", "D. 支持共享式和交换式两种组网方式"], "answer": "C", "explain": "100BASE-T 用 5 类 UTP 时最大传输距离是 100m，不是 185m。"}, {"sheet": "第3章作业", "index": 6, "type": "单选题", "body": "10BASE-T是指()", "options": ["A. 粗同轴电缆", "B. 细同轴电缆", "C. 双绞线", "D. 光纤"], "answer": "C", "explain": "10BASE-T 中 T 代表双绞线。"}, {"sheet": "第3章作业", "index": 7, "type": "单选题", "body": "在局域网中,MAC指的是()。", "options": ["A. 逻辑链路控制子层", "B. 介质访问控制子层", "C. 物理层", "D. 数据链路层"], "answer": "B", "explain": "MAC 是介质访问控制子层的缩写，属数据链路层的子层。"}, {"sheet": "第3章作业", "index": 8, "type": "单选题", "body": "使用双绞线作为传输介质,适用于下列哪种类型的以太网()", "options": ["A. 10Base-5", "B. 10/100Base-T", "C. 10/100Base-F", "D. 10Base-2"], "answer": "B", "explain": "10/100Base-T 使用双绞线；Base-5、Base-2 用同轴电缆，Base-F 用光纤。"}, {"sheet": "第3章作业", "index": 9, "type": "单选题", "body": "PPP协议是哪一层的协议()", "options": ["A. 物理层", "B. 数据链路层", "C. 网络层", "D. 高层"], "answer": "B", "explain": "PPP 是数据链路层协议。"}, {"sheet": "第3章作业", "index": 10, "type": "单选题", "body": "在中继系统中,中继器处于()", "options": ["A. 物理层", "B. 数据链路层", "C. 网络层", "D. 高层"], "answer": "A", "explain": "中继器是物理层设备。"}, {"sheet": "第3章作业", "index": 11, "type": "单选题", "body": "就交换技术而言,局域网中的以太网采用的是()", "options": ["A. 分组交换技术", "B. 电路交换技术", "C. 报文交换技术", "D. 分组交换与电路交换结合技术"], "answer": "A", "explain": "以太网按帧存储转发分组，采用分组交换技术。"}, {"sheet": "第3章作业", "index": 12, "type": "单选题", "body": "一个VLAN可以看作是一个 ()", "options": ["A. 冲突域", "B. 广播域", "C. 管理域", "D. 阻塞域"], "answer": "B", "explain": "一个 VLAN 是一个广播域。"}, {"sheet": "第3章作业", "index": 13, "type": "单选题", "body": "能从数据信号波形中提取同步信号的典型编码是()。", "options": ["A. 归零码", "B. 不归零码", "C. 定比码", "D. 曼彻斯特编码"], "answer": "D", "explain": "曼彻斯特编码每比特都有跳变，可提取同步信号。"}, {"sheet": "第3章作业", "index": 14, "type": "单选题", "body": "下列有关集线器的说法正确的是()。", "options": ["A. 集线器只能和工作站相连", "B. 利用集线器可将总线型网络转换为星型拓扑", "C. 集线器只对信号起传递作用", "D. 集线器能实现网段的隔离"], "answer": "B", "explain": "集线器将各工作站接入同一总线，物理上呈星形，逻辑上仍是总线。"}, {"sheet": "第3章作业", "index": 15, "type": "单选题", "body": "以太网交换机的每一个端口可以看做一个()", "options": ["A. 冲突域", "B. 广播域", "C. 管理域", "D. 阻塞域"], "answer": "A", "explain": "交换机每个端口是一个独立的冲突域。"}, {"sheet": "第3章作业", "index": 16, "type": "单选题", "body": "在下图的网络配置中,总共()个广播域。 [眼增]", "options": ["A. 2", "B. 3", "C. 4", "D. 5"], "answer": "A", "explain": "图中两个路由器/交换机各分隔出一个广播域，共 2 个。"}, {"sheet": "第3章作业", "index": 17, "type": "单选题", "body": "在16题图中的网络配置中,总共有()个冲突域。", "options": ["A. 2", "B. 5", "C. 7", "D. 10"], "answer": "C", "explain": "交换机每个端口是冲突域，路由器每个接口也是，计数得 7 个。"}, {"sheet": "第3章作业", "index": 18, "type": "单选题", "body": "网卡是完成()功能的。", "options": ["A. 物理层", "B. 数据链路层", "C. 物理和数据链路层", "D. 数据链路层和网络层"], "answer": "C", "explain": "网卡完成物理层和数据链路层功能。"}, {"sheet": "第3章作业", "index": 19, "type": "单选题", "body": "CSMA/CD是IEEE802.3所定义的协议标准,它适用于()。", "options": ["A. 令牌环网", "B. 令牌总线网", "C. 网络互连", "D. 以太网"], "answer": "D", "explain": "CSMA/CD 由 IEEE 802.3 定义，适用于以太网。"}, {"sheet": "第3章作业", "index": 20, "type": "单选题", "body": "若网络形状是由站点和连接站点的链路组成的一个闭合环,则称这种拓扑结构为()", "options": ["A. 星形拓扑", "B. 总线拓扑", "C. 环形拓扑", "D. 树形拓扑"], "answer": "C", "explain": "站点与链路组成闭合环，是环形拓扑。"}, {"sheet": "第3章作业", "index": 21, "type": "单选题", "body": "对于基带CSMA/CD而言,为了确保发送站点在传输时能检测到可能存在的冲突,数据帧的发送时延至少要等于信号单程传播时延的()", "options": ["A. 1倍", "B. 2倍", "C. 4倍", "D. 2.5倍"], "answer": "B", "explain": "帧的发送时延至少要等于信号单程传播时延的 2 倍（即争用期）。"}, {"sheet": "第3章作业", "index": 22, "type": "单选题", "body": "802.3以太网最大可传送的帧(数据)长度为()个8位组。", "options": ["A. 64", "B. 32", "C. 256", "D. 1500"], "answer": "D", "explain": "802.3 以太网数据部分最大 1500 字节（8 位组）。"}, {"sheet": "第3章作业", "index": 23, "type": "单选题", "body": "下列只能简单再生信号的设备是。()", "options": ["A. 网卡", "B. 网桥", "C. 中继器", "D. 路由器"], "answer": "C", "explain": "中继器只做信号再生放大。"}, {"sheet": "第3章作业", "index": 24, "type": "单选题", "body": "下面有关VLAN的说法正确的是()。", "options": ["A. 一个VLAN组成一个广播域", "B. 一个VLAN是一个冲突域", "C. 各个VLAN之间不能通信", "D. VLAN之间必须通过服务器交换信息"], "answer": "A", "explain": "一个 VLAN 组成一个广播域，VLAN 间可通过路由器通信。"}, {"sheet": "第3章作业", "index": 25, "type": "单选题", "body": "下面关于CSMA/CD网络的叙述哪个是正确的?()", "options": ["A. 任何一个节点的通信数据要通过整个网络,并且每—个节点都接收并检验该数据", "B. 如果源节点知道目的地的IP和MAC地址的话,信号是直接送往目的地", "C. —个节点的数据发往最近的路由器,路由器将数据直接发到目的地", "D. 信号都是以多播方式发送的"], "answer": "A", "explain": "CSMA/CD 以太网中数据广播到整个网络，每节点都接收并检验。"}, {"sheet": "第3章作业", "index": 26, "type": "单选题", "body": "以太网100BASE-FX标准规定的传输介质是()", "options": ["A. 3类UTP", "B. 5类UTP", "C. 无线介质", "D. 光纤"], "answer": "D", "explain": "100BASE-FX 的 F 表示光纤。"}, {"sheet": "第3章作业", "index": 27, "type": "单选题", "body": "在缺省配置的情况下,交换机的所有端口属于同一VLAN,连接在不同交换机上的,属于同一VLAN的数据帧必须通过()传输。", "options": ["A. 直通链路", "B. Access链路", "C. 不同VLAN", "D. Trunk链路"], "answer": "D", "explain": "跨交换机同一 VLAN 的帧通过 Trunk 链路传输。"}, {"sheet": "第3章作业", "index": 28, "type": "单选题", "body": "一台主机正在检测所收到的帧的校验和,这个动作发生在OSI模型的哪一层?()", "options": ["A. 物理层", "B. 数据链路层", "C. 网络层", "D. 传输层"], "answer": "B", "explain": "帧校验和（FCS）检查在数据链路层完成。"}, {"sheet": "第3章作业", "index": 29, "type": "单选题", "body": "MAC地址是一个___字节的二进制串,以太网MAC地址由IEEE负责分配。以太网地址分为两个部分:地址的前___个字节代表厂商代码,后___个字节由厂商自行分配。()", "options": ["A. 6,3,3", "B. 6,4,2", "C. 6,2,4", "D. 5,3,2"], "answer": "A", "explain": "MAC 地址 6 字节，前 3 字节厂商代码，后 3 字节厂商自定。"}, {"sheet": "第3章作业", "index": 30, "type": "单选题", "body": "交换机收到一个帧,但该帧的目标地址在其MAC地址表中找不到对应,交换机将()", "options": ["A. 丢弃", "B. 退回", "C. 洪泛", "D. 转发给网关"], "answer": "C", "explain": "交换机查不到目的 MAC 时向除入端口外所有端口洪泛。"}, {"sheet": "第3章作业", "index": 31, "type": "单选题", "body": "以下有关以太网MAC地址说法正确的是()", "options": ["A. MAC地址全球唯一", "B. MAC地址56位", "C. MAC地址中前八位十六进制数由IEEE统一分配,后八位十六制数由厂商自行分配", "D. Internet中每个设备都有MAC地址"], "answer": "A", "explain": "MAC 地址 48 位全球唯一。"}, {"sheet": "第3章作业", "index": 32, "type": "单选题", "body": "采用CSMA/CD的以太网中,哪个说法正确()", "options": ["A. 所有站点都监听冲突", "B. 只有发送的站点监听冲突", "C. 监听到冲突后立即放弃此数据帧的发送,不做任何重发尝试", "D. 监听到冲突后继续发送本数据帧的后续部分"], "answer": "B", "explain": "CSMA/CD 中只有正在发送的站点才监听冲突。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 1, "type": "单选题", "body": "数据链路层传输和处理数据的单位是( )。", "options": ["A. 报文段", "B. 比特流", "C. 数据报", "D. 帧"], "answer": "D", "explain": "数据链路层传输和处理数据的单位是帧。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 2, "type": "单选题", "body": "某个数据链路层协议使用下列字符编码:字符A的编码为01000111、字符B的编码为11100011、字符ESC的编码为11100000、字符FLAG的编码为01111110、使用字符FLAG作为帧定界符,字符ESC作为转义字符。 现在要对欲传输的4个字符A、B、ESC、FLAG封装成帧。若物理链路是面向字符的,则封装出的帧的二进制位序列是( )。", "options": ["A. 11100000 01000111 11100011 11100000 01111110 11100000", "B. 01111110 01000111 11100011 11100000 01111110 01111110", "C. 01111110 01000111 11100011 11100000 11100000 11100000 01111110 01111110", "D. 11100000 01000111 11100011 11100000 11100000 11100000 01111110 11100000"], "answer": "C", "explain": "面向字符成帧：首尾加 FLAG，数据中出现的 FLAG 和 ESC 前插 ESC 转义。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 3, "type": "单选题", "body": "若题2中的物理链路是面向比特的,则封装出的帧的二进制位序列是( )。", "options": ["A. 11100000 01000111 11100011 11100000 01111110 11100000", "B. 01111110 01000111 11100011 11100000 01111110 01111110", "C. 11100000 01000111 110100011 111000000 011111010 11100000", "D. 01111110 01000111 110100011 111000000 011111010 01111110"], "answer": "D", "explain": "面向比特成帧采用零比特填充：数据中连续 5 个 1 后插 0。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 4, "type": "单选题", "body": "下列关于循环冗余校验的说法中,错误的是()。", "options": ["A. 通信双方可以无须商定就直接使用任意生成多项式", "B. CRC 校验可以使用硬件来完成", "C. 有一些特殊的生成多项式,因为其有很好的特,而成了国际标准", "D. 严格挑选生成多项式,可使CRC校验的漏检率极低"], "answer": "A", "explain": "CRC 的生成多项式必须双方事先商定，A 说法错误。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 5, "type": "单选题", "body": "要发送的数据是1101 0110 11,采用CRC校验,生成多项式是10011,那么最终发送的数据应是( )。", "options": ["A. 1101 0110 1110 10", "B. 1101 0110 1101 10", "C. 1101 0110 1111 10", "D. 1111 0011 0111 00"], "answer": "C", "explain": "数据补 4 个 0 后与 10011 模 2 除，余数 1110 附加到数据后。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 6, "type": "单选题", "body": "若采用CRC校验,生成多项式为[像领],则在进行模2除法时, 除数为( )。", "options": ["A. 1101", "B. 11011", "C. 00100", "D. 0010"], "answer": "B", "explain": "生成多项式对应位串 11011 即除数。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 7, "type": "单选题", "body": "要发送的数据是1101 0010,采用CRC校验, 生成多项式为 [像领], 则在进行模 2除法时,被除数是( )。", "options": ["A. 1101 0010 1111", "B. 1101 0010 0000", "C. 1101 0010 1010", "D. 1101 0010 0101"], "answer": "B", "explain": "被除数=数据后补生成多项式次数个 0，即 1101 0010 0000。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 8, "type": "单选题", "body": "PPP协议中的LCP帧的作用是( )。", "options": ["A. 在建立状态阶段协商数据链路协议的选项", "B. 配置网络层协议", "C. 检查数据链路层的错误,并通知错误信息", "D. 安全控制,保护通信双方的数据安全"], "answer": "A", "explain": "LCP 帧在建立状态协商数据链路层选项；NCP 配置网络层。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 9, "type": "单选题", "body": "以太网卡实现的主要功能在( )。", "options": ["A. 物理层和数据链路层", "B. 数据链路层和网络层", "C. 物理层和网络层", "D. 数据链路层和应用层"], "answer": "A", "explain": "网卡实现物理层和数据链路层功能。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 10, "type": "单选题", "body": "下面地址中是广播MAC地址的是( )。", "options": ["A. 00-00-00-00-00-00", "B. AB-CD-EF-11-22-33", "C. FF-FF-FF-FF-FF-FF", "D. 29-29-29-29-29-29"], "answer": "C", "explain": "全 1 的 MAC 地址 FF-FF-FF-FF-FF-FF 是广播地址。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 11, "type": "单选题", "body": "在CSMA/CD协议中,“争用期” 指的是( )。", "options": ["A. 信号在最远两个端点之间往返传播的时间", "B. 信号从线路一端传播到另一端的时间", "C. 从发送开始到收到应答的时间", "D. 从发送完毕到收到应答的时间"], "answer": "A", "explain": "争用期是信号在最远两端点之间往返传播的时间 2τ。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 12, "type": "单选题", "body": "长度为10km, 数据传输率为 10Mb/s的CSMA/CD以太网, 信号传播速率为200m/μs,则该网络的最小帧长为( )。", "options": ["A. 20bit", "B. 200bit", "C. 100bit", "D. 1000bit"], "answer": "D", "explain": "最小帧长=2τ×速率=2×(10km÷200m/μs)×10Mb/s=1000bit。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 13, "type": "单选题", "body": "CSMA/CD以太网发生冲突时,采用截断二进制指数退避算法进行处理。下列数据帧重传时再次发生冲突的概率最低的是( )。", "options": ["A. 首次重传的帧", "B. 发生两次重传的帧", "C. 发生三次重传的帧", "D. 发生四次重传的帧"], "answer": "D", "explain": "重传次数越多，退避范围越大，再次冲突概率越低。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 14, "type": "单选题", "body": "CSMA/CD以太网采用截断二进制指数退避算法,在12次碰撞之后,站点会在0~()倍的基本退避时间之间选择一个随机数。", "options": ["A. 255", "B. 511", "C. 1023", "D. 2047"], "answer": "C", "explain": "12 次碰撞后取 0~2^10-1=1023 倍基本退避时间。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 15, "type": "单选题", "body": "假设一个采用CSMA/CD协议的1000Mb/s局域网,最小帧长为256B,则在一个冲突域内两个站点之间的单向传播延时最多是()。", "options": ["A. 1.024μs", "B. 2.048μs", "C. 4.096μs", "D. 8.192μs"], "answer": "A", "explain": "单向传播时延=最小帧长÷2÷速率=256×8÷2÷1000Mb/s=1.024μs。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 16, "type": "单选题", "body": "CSMA/CD以太网的争用期记为2τ,某个站点在12次碰撞后,可能的最长退避时间为()。", "options": ["A. 12τ", "B. 24τ", "C. 2046τ", "D. 2048τ"], "answer": "C", "explain": "12 次碰撞后最长为 2×(2^10-1)τ=2046τ。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 17, "type": "单选题", "body": "以太网中,当数据传输率提高时,帧的发送时间会相应地缩短, 这样可能会影响到冲突的检测。为了能有效地检测冲突,可以使用的解决方法有()。", "options": ["A. 减少传输介质的长度或减少最短帧长", "B. 减少传输介质的长度或增加最短帧长", "C. 增加传输介质的长度或减少最短帧长", "D. 增加传输介质的长度或增加最短帧长"], "answer": "B", "explain": "提高速率后需缩短介质长度或增大最短帧长来保证冲突检测。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 18, "type": "单选题", "body": "一般来说,集线器连接的网络在拓扑结构上属于()。", "options": ["A. 网状", "B. 树形", "C. 环形", "D. 星形"], "answer": "D", "explain": "集线器连接的网络物理上是星形拓扑。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 19, "type": "单选题", "body": "用集线器连接的工作站集合()。", "options": ["A. 同属一个冲突域,也同属一个广播域", "B. 不同属一个冲突域,但同属一个广播域", "C. 不同属一个冲突域,也不同属一个广播域", "D. 同属一个冲突域,但不同属一个广播域"], "answer": "A", "explain": "集线器所有端口同属一个冲突域和一个广播域。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 20, "type": "单选题", "body": "若有5台计算机连接到一台10Mb/s的集线器上,则每台计算机分得的平均带宽为()。", "options": ["A. 2Mb/s", "B. 5Mb/s", "C. 10Mb/s", "D. 50Mb/s"], "answer": "A", "explain": "集线器共享 10Mb/s，5 台平均每台 2Mb/s。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 21, "type": "单选题", "body": "当集线器的一个端口收到数据后,将其()。", "options": ["A. 从所有端口广播出去", "B. 从除输入端口的所有端口广播出去", "C. 根据目的地址从合适的端口转发出去", "D. 随机选择一个端口转发出去"], "answer": "B", "explain": "集线器从除输入端口外的所有端口广播数据。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 22, "type": "单选题", "body": "以太网交换机实现的主要功能在()。", "options": ["A. 物理层和数据链路层", "B. 数据链路层和网络层", "C. 物理层和网络层", "D. 数据链路层和应用层"], "answer": "A", "explain": "以太网交换机工作在物理层和数据链路层。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 23, "type": "单选题", "body": "通过交换机连接的一组工作站()。", "options": ["A. 组成一个冲突域,但不是一个广播域", "B. 组成一个广播域,但不是一个冲突域", "C. 既是一个冲突域,又是一个广播域", "D. 既不是冲突域,也不是广播域"], "answer": "B", "explain": "交换机隔离冲突域，但默认所有端口同属一个广播域。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 24, "type": "单选题", "body": "交换机比集线器提供更好的网络性能的原因是()。", "options": ["A. 交换机支持多对用户同时通信", "B. 交换机使用差错控制减少出错率", "C. 交换机使网络的覆盖范围更大", "D. 交换机无须设置,使用更方便"], "answer": "A", "explain": "交换机支持多对端口同时转发，支持多对用户同时通信。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 25, "type": "单选题", "body": "对于由以太网交换机连接的100Mb/s的交换式以太网,若共有10个用户,则每个用户能够占有的带宽为()。", "options": ["A. 1Mb/s", "B. 10Mb/s", "C. 100Mb/s", "D. 1000Mb/s"], "answer": "C", "explain": "交换式以太网每端口独享带宽，每个用户 100Mb/s。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 26, "type": "单选题", "body": "下列网络连接设备都工作在数据链路层的是()。", "options": ["A. 中继器和集线器", "B. 集线器和网桥", "C. 网桥和以太网交换机", "D. 集线器和以太网交换机"], "answer": "C", "explain": "网桥和以太网交换机都工作在数据链路层。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 27, "type": "单选题", "body": "下列不能分割碰撞域的设备是()。", "options": ["A. 集线器", "B. 交换机", "C. 路由器", "D. 网桥"], "answer": "A", "explain": "集线器不隔离冲突域；交换机、网桥、路由器都能分割冲突域。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 28, "type": "单选题", "body": "一个16端口的集线器的冲突域和广播域的个数分别是()。", "options": ["A. 16,1", "B. 16,16", "C. 1, 1", "D. 1,16"], "answer": "C", "explain": "16 端口集线器只有 1 个冲突域和 1 个广播域。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 29, "type": "单选题", "body": "以太网交换机的自学习是指()。", "options": ["A. 记录帧的源MAC地址与该帧进入交换机的端口号", "B. 记录帧的目的MAC地址与该帧进入交换机的端口号", "C. 记录数据包的源IP地址与该数据包进入交换机的端口号", "D. 记录数据包的目的IP地址与该数据包进入交换机的端口号"], "answer": "A", "explain": "自学习指记录源 MAC 地址与帧进入的端口号。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 30, "type": "单选题", "body": "假设交换机的转发表是空的,当交换机收到某个单播帧后,会将该帧()。", "options": ["A. 丢弃", "B. 泛洪", "C. 从接收该帧的端口再转发该帧", "D. 从另外的某个端口转发该帧"], "answer": "B", "explain": "转发表为空时交换机对单播帧泛洪（除入端口外）。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 31, "type": "单选题", "body": "网络拓扑如图3-31所示,各主机的MAC地址和网桥的转发表已标注在了图中。 假设主机A给C发送一个以太网帧,则该帧能够到达主机的数量为()。 [像领] 习题3-31图", "options": ["A. 1", "B. 2", "C. 4", "D. 5"], "answer": "D", "explain": "网桥向除入端口外转发，帧能到达 5 台主机。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 32, "type": "单选题", "body": "网络拓扑如图3-32所示,假设交换机当前转发表为空,主机B给C发送1个数据帧,主机C收到该帧后,向主机B发送1个确认帧,交换机对这两个帧的转发端口分别是()。 [像领] 习题3-32图", "options": ["A. {3}和{2}", "B. {3}和{1, 2}", "C. {1, 3}和{1, 2}", "D. {1, 3}和{2}"], "answer": "D", "explain": "B 发帧时交换机泛洪到 {1,3}，学会 B 在端口 2；确认帧从端口 2 转发给 B。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 33, "type": "单选题", "body": "网络拓扑如图3-33所示,假设交换机的帧交换表初始为空,主机A给B发送数 据帧,主机B收到后给A发送确认帧,则图中能收到数据帧的主机数量和能收到确认帧的主机数量分别是()。 [像领] 习题3-33图", "options": ["A. 1, 1", "B. 1, 3", "C. 3, 1", "D. 3, 3"], "answer": "C", "explain": "A 发帧时转发表为空，泛洪到 3 台主机；学会 A 后确认帧只转发给 A，共 1 台。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 34, "type": "单选题", "body": "以太网交换机使用生成树协议STP的目的是()。", "options": ["A. 提高网络带宽", "B. 消除网络环路", "C. 形成网络环路", "D. 提高网络可靠性"], "answer": "B", "explain": "生成树协议 STP 的目的是消除网络环路。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 35, "type": "单选题", "body": "以下关于VLAN的描述中,错误的是()。", "options": ["A. 从数据链路层的角度看,不同VLAN中的站点之间不能直接通信。", "B. 属于同一个VLAN中的两个站点可能连接在不同的交换机上。", "C. 虚拟局域网只是局域网给用户提供的一种服务,而不是一种新型局域网。", "D. VLAN使用的802.1Q帧的最大长度为1518字节。"], "answer": "D", "explain": "802.1Q 帧因插入 4 字节标记，最大长度为 1522 字节。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 36, "type": "单选题", "body": "以下关于VLAN的描述中, 错误的是()。", "options": ["A. IEEE 802.1Q 帧对以太网的 MAC 帧格式进行了扩展，插入了 4 字节的 VLAN标记", "B. 从交换机 Access 端口进入交换机的普通以太网帧会被交换机插入 4 字节VLAN 标记", "C. 交换机之间传送的帧可能是 IEEE 802.1Q 帧， 也可能是普通以太网帧", "D. 交换机的 Trunk 类型端口转发 IEEE 802.1Q 帧时，必须删除其 4 字节 VLAN标记"], "answer": "D", "explain": "Trunk 端口转发 802.1Q 帧时保留 VLAN 标记，不删除。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 37, "type": "单选题", "body": "以太网交换机进行转发决策时使用的PDU地址是()。", "options": ["A. 目的物理地址", "B. 目的IP地址", "C. 源物理地址", "D. 源IP地址"], "answer": "A", "explain": "交换机转发决策依据目的 MAC（物理）地址。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 38, "type": "单选题", "body": "在一个采用CSMA/CD协议的网络中,传输介质是一根完整的电缆,传输速率为1Gbps,电缆中的信号传播速度是200 000km/s。 若最小数据帧长度减少800比特,则最远的两个站点之间的距离至少需要()。", "options": ["A. 增加160m", "B. 增加80m", "C. 减少160m", "D. 减少80m"], "answer": "D", "explain": "最小帧长减小后须缩短跨距，减少量=800bit÷1Gbps×200000km/s÷2=80m。"}, {"sheet": "第3章 数据链路层 课后测试题-2404211", "index": 39, "type": "单选题", "body": "某以太网拓扑及交换机当前转发表如图3-39所示,主机00-e1-d5-00-23-a1向主机00-e1-d5-00-23-c1发送1个数据帧,主机00-e1-d5-00-23-c1收到该帧后,向主机00-e1-d5-00-23-a1发送1个确认帧,交换机对这两个帧的转发端口分别是()。 [像领] 习题3-39图", "options": ["A. {3}和{1}", "B. {2,3}和{1}",  "关于ARP表,以下描述中正确的是( )", "options": ["A. 提供常用目标地址的快捷方式来减少网络流量", "B. 用于建立IP地址到MAC地址的映射", "C. 用于在各个子网之间进行路由选择", "D. 用于进行应用层信息的转换"], "answer": "B", "explain": "ARP 表建立 IP 地址到 MAC 地址的映射。"}, {"sheet": "第4章网络层作业", "index": 32, "type": "单选题", "body": "当一个以太网中的一台源主机要发送数据给同一网络中的另一台目的主机时,以太帧头部的目的地址是_______,IP包头部的目的地址_____。( )", "options": ["A. 目的主机的MAC地址,目的主机的IP地址", "B. 路由器的MAC地址,路由器的IP地址", "C. 目的主机的IP地址,目的主机的MAC地址", "D. 路由器的MAC地址,目的主机的IP地址"], "answer": "A", "explain": "同网段直接交付：帧头目的 MAC 和 IP 头目的 IP 都是目的主机的。"}, {"sheet": "第4章网络层作业", "index": 33, "type": "单选题", "body": "下列关于IPv4地址的描述中错误是( )", "options": ["A. IP地址的总长度为32位", "B. 每一个IP地址都由网络地址和主机地址组成", "C. 一个C类地址拥有8位主机地址,可给254台主机分配地址", "D. A类地址拥有最多的网络数"], "answer": "D", "explain": "A 类网络数只有 126 个，数量最少，D 说法错误。"}, {"sheet": "第4章网络层作业", "index": 34, "type": "单选题", "body": "路由器在两个网段之间转发数据包时,读取其中的( ) 地址来确定下一跳的转发路径。", "options": ["A. 目标IP", "B. MAC", "C. 源IP", "D. ARP"], "answer": "A", "explain": "路由器依据目标 IP 地址查路由表确定下一跳。"}, {"sheet": "第4章网络层作业", "index": 35, "type": "单选题", "body": "以下对IP地址分配中描述不正确的是( )", "options": ["A. 网络ID不能全为1或全为0", "B. 同一网络上每台主机必须有不同的网络ID", "C. 网络ID不能以127开头", "D. 同一网络上每台主机必须分配唯一的主机ID"], "answer": "B", "explain": "同一网络内各主机网络 ID 相同、主机 ID 不同，B 描述不正确。"}, {"sheet": "第4章网络层作业", "index": 36, "type": "单选题", "body": "在IP数据报首部的片偏移字段是以( )为单位的。", "options": ["A. 1字节", "B. 4字节", "C. 8字节", "D. 以上都不是"], "answer": "C", "explain": "片偏移以 8 字节为单位。"}, {"sheet": "第4章网络层作业", "index": 37, "type": "单选题", "body": "随着微型计算机的广泛应用,大量的微型计算机是通过局域网连入到广域网的,而局域网与广域网的互联一般是通过( ) 设备实现的。", "options": ["A. Ethernet交换机", "B. 路由器", "C. 网桥", "D. 电话交换机"], "answer": "B", "explain": "局域网与广域网互联通过路由器实现。"}, {"sheet": "第4章网络层作业", "index": 38, "type": "单选题", "body": "IPv4版本的因特网总共有( )个A类地址网络。", "options": ["A. 65000", "B. 200万", "C. 126", "D. 128"], "answer": "C", "explain": "A 类网络号 1~126，共 126 个。"}, {"sheet": "第4章网络层作业", "index": 39, "type": "单选题", "body": "出于安全的考试,管理员希望阻止由外网进入的PING嗅探,那么管理员需要阻止哪一类协议?( )", "options": ["A. TCP", "B. UDP", "C. IP", "D. ICMP"], "answer": "D", "explain": "PING 使用 ICMP，阻止嗅探需拦截 ICMP。"}, {"sheet": "第4章网络层作业", "index": 40, "type": "单选题", "body": "Ipv6 将32 位地址空间扩展到( ) 。", "options": ["A. 64 位", "B. 128 位", "C. 256 位", "D. 1024 位"], "answer": "B", "explain": "IPv6 地址空间扩展到 128 位。"}, {"sheet": "第4章网络层作业", "index": 41, "type": "单选题", "body": "下面( )命令用于测试网络是否连通。", "options": ["A. telnet", "B. nslookup", "C. ping", "D. ftp"], "answer": "C", "explain": "ping 命令测试网络连通性。"}, {"sheet": "第4章网络层作业", "index": 42, "type": "单选题", "body": "当路由器接收的IP报文中的目标网络不在路由表中时,将采取的策略是( )", "options": ["A. 丢掉该报文", "B. 将该报文以广播的形式从该路由器的所有端口发出", "C. 将报文退还给上级设备", "D. 向某个特定的路由器请求路由"], "answer": "A", "explain": "路由表中查不到目标网络时路由器丢弃该报文。"}, {"sheet": "第4章网络层作业", "index": 43, "type": "单选题", "body": "以下各项中,不是IP数据报操作特点的是( )", "options": ["A. 每个分组自身携带有足够的信息,它的传送是被单独处理的", "B. 在整个传送过程中,不需建立虚电路", "C. 使所有分组按顺序到达目的端系统", "D. 网络节点要为每个分组做出路由选择"], "answer": "C", "explain": "数据报方式不保证分组按序到达，C 不是其特点。"}, {"sheet": "第4章网络层作业", "index": 44, "type": "单选题", "body": "关于 OSPF 和 RIP，下列说法正确的是（ ）。", "options": ["A. OSPF 和 RIP 都是静态路由", "B. OSPF 属于距离向量型路由协议，RIP 属于链路状态型路由协议", "C. OSPF 适合在小型的、动态的互联网上使用，而 RIP 适合在大型的、动态的互联网上使用", "D. OSPF 适合在大型的、动态的互联网上使用，而 RIP 适合在小型的、动态的互联网上使用"], "answer": "D", "explain": "OSPF 是链路状态协议适合大型网络，RIP 是距离向量适合小型网络。"}, {"sheet": "第4章网络层作业", "index": 45, "type": "单选题", "body": "下列（ ）的情况下需要启动 ARP 请求。", "options": ["A. 主机需要接收信息，但 ARP 表中没有源 IP 地址与 MAC 地址的映射关系", "B. 主机需要接收信息，但 ARP 表中只具有源 IP 地址与 MAC 地址的映射关系", "C. 主机需要发送信息，但 ARP 表中没有目的 IP 地址与 MAC 地址的映射关系", "D. 主机需要发送信息，但 ARP 表中只具有目的 IP 地址与 MAC 地址的映射关系"], "answer": "C", "explain": "发送信息且 ARP 表无目的 IP 对应 MAC 时启动 ARP 请求。"}, {"sheet": "第4章网络层作业", "index": 46, "type": "单选题", "body": "转发数据包时，网络层所使用的主要信息依据是（ ）。", "options": ["A. IP 路由表", "B. MAC 地址表", "C. ARP 缓存", "D. 端口列表"], "answer": "A", "explain": "网络层转发依据 IP 路由表。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 1, "type": "单选题", "body": "下列关于虚电路服务和数据报服务的叙述中错误的是( ) 。", "options": ["A. 虚电路服务可以确保数据分组传输顺序", "B. 虚电路服务无需进行路由选择", "C. 数据报服务不能确保数据分组传输顺序", "D. 数据报服务中的每个分组都有终点的完整地址"], "answer": "B", "explain": "虚电路也需要逐跳路由选择，B 说法错误。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 2, "type": "单选题", "body": "在因特网使用的 TCP/IP 协议栈中,核心协议是( ) 。", "options": ["A. TCP", "B. IP", "C. ARP", "D. HTTP"], "answer": "B", "explain": "TCP/IP 协议栈的核心是 IP 协议。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 3, "type": "单选题", "body": "以太网 MAC 地址、IPv4 地址、IPv6 地址的地址空间大小分别是( ) 。", "options": ["A. [像领]", "B. [像领]", "C. [像领]", "D. [像领]"], "answer": "C", "explain": "MAC 48 位、IPv4 32 位、IPv6 128 位。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 4, "type": "单选题", "body": "某个 IPv4 地址的二进制形式为 11000000111111100000111111110000, 则点分十进 制形式为( ) 。", "options": ["A. 192.254.15.240", "B. 240.15.254.192", "C. 96.128.51.120", "D. 120.51.128.96"], "answer": "A", "explain": "每 8 位一组转十进制：11000000=192 等，得 192.254.15.240。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 5, "type": "单选题", "body": "分类编址的 IPv4 地址共分( ) 。", "options": ["A. 3类", "B. 4类", "C. 5类", "D. 6类"], "answer": "C", "explain": "分类编址 IPv4 分 A、B、C、D、E 共 5 类。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 6, "type": "单选题", "body": "在 IPv4 地址的分类编址阶段,A类网的数量为( ) 。", "options": ["A. [像领]", "B. [像领]", "C. [像领]", "D. [像领]"], "answer": "B", "explain": "A 类网共 2^7-2=126 个。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 7, "type": "单选题", "body": "在 IPv4 地址的分类编址阶段,每个B类网包含的IP地址数量为( ) 。", "options": ["A. [像领]", "B. [像领]", "C. [像领]", "D. [像领]"], "answer": "C", "explain": "每个 B 类网含 2^16=65536 个地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 8, "type": "单选题", "body": "在IPv4地址的分类编址阶段,每个C类网可分配给主机或路由器接口的IP地址 数量为( ) 。", "options": ["A. [像领]", "B. [像领]", "C. [像领]", "D. [像领]"], "answer": "B", "explain": "C 类网主机号 8 位，可分配 2^8-2=254 个。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 9, "type": "单选题", "body": "以下属于C类IPv4地址,但又不能分配给主机的是( ) 。", "options": ["A. 196.2.3.8", "B. 192.0.0.255", "C. 191.255.255.252", "D. 126.255.255.255"], "answer": "B", "explain": "192.0.0.255 是 C 类网络号，主机号全 1，不能分配给主机。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 10, "type": "单选题", "body": "下列地址中,属于本地环回地址的是( ) 。", "options": ["A. 10.10.10.1", "B. 255.255.255.0", "C. 192.0.0.1", "D. 127.0.0.1"], "answer": "D", "explain": "127.0.0.1 是本地环回地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 11, "type": "单选题", "body": "为了提供更多的子网,为一个B类网指定了子网掩码 255.255.240.0,则每个子网 可分配给主机或路由器接口的 IPv4 地址数量是( ) 。", "options": ["A. 254", "B. 256", "C. 4094", "D. 4096"], "answer": "C", "explain": "主机位 12 位，可分配 2^12-2=4094 个。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 12, "type": "单选题", "body": "已知某个网络的地址为 192.168.0.0,使用子网掩码 255.255.255.128 对其进行子网 划分,可划分出的子网数量为( ) 。", "options": ["A. 2", "B. 4", "C. 8", "D. 16"], "answer": "A", "explain": "借 1 位主机号划分子网，可划 2 个子网。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 13, "type": "单选题", "body": "已知某个网络地址为 10.0.0.0,使用子网掩码 255.255.192.0 对其进行子网划分, 则每个子网包含的地址数量为( ) 。", "options": ["A. [像领]", "B. [像领]", "C. [像领]", "D. [像领]"], "answer": "C", "explain": "掩码 255.255.192.0 主机位 14 位，每子网 2^14=16384 个地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 14, "type": "单选题", "body": "已知某个网络地址为 172.16.0.0,使用子网掩码 255.255.224.0 对其进行子网划分, 则所划分出的最后一个子网的广播地址是( ) 。", "options": ["A. 172.16.0.255", "B. 172.16.255.255", "C. 172.0.255.255", "D. 172.255.255.255"], "answer": "B", "explain": "255.255.224.0 借 3 位，最后子网覆盖 224~255，广播地址 172.16.255.255。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 15, "type": "单选题", "body": "访问互联网的每台主机都需要分配IP地址(假定采用默认子网掩码),下列分类 的IPv4 地址可以分配给主机的是( )。", "options": ["A. 192.46.10.0", "B. 110.47.10.0", "C. 127.10.10.17", "D. 211.60.256.21"], "answer": "B", "explain": "110.47.10.0 是 A 类网中可分配给主机的地址；其余为网络号或环回。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 16, "type": "单选题", "body": "某个IPv4地址的CIDR表示形式为 126.166.66.99/22,则以下描述错误的是( ) 。", "options": ["A. 网络前缀占用 22 个比特", "B. 主机编号占用 10 个比特", "C. 所在地址块包含地址数量为 1024", "D. 126.166.66.99是所在地址块中的第一个地址"], "answer": "D", "explain": "/22 块 1024 个地址，99 不是块内第一个地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 17, "type": "单选题", "body": "下列地址中, 属于地址块 86.32.0.0/12的地址是( ) 。", "options": ["A. 86.33.224.123", "B. 86.79.65.126", "C. 86.79.65.216", "D. 86.68.206.154"], "answer": "A", "explain": "86.32.0.0/12 覆盖 32~47，86.33.224.123 在其中。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 18, "type": "单选题", "body": "CIDR 地址块 10.0.0.0/10 中的最后一个地址是( ) 。", "options": ["A. 10.63.255.255", "B. 10.255.255.255", "C. 10.0.255.255", "D. 10.0.0.255"], "answer": "A", "explain": "10.0.0.0/10 覆盖 10.0~10.63，最后地址 10.63.255.255。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 19, "type": "单选题", "body": "若将某个“ /19”的 CIDR 地址块划分为7个子块,则可能的最小子块中的可分配 IP地址数量是( ) 。", "options": ["A. 126", "B. 256", "C. 512", "D. 1022"], "answer": "A", "explain": "/19 划分为 7 块，最小块为 /22，可分配 2^10-2=1022 个。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 20, "type": "单选题", "body": "某主机的 IP 地址为 166.199.99.96/19。若该主机向其所在网络发送广播 IP 数据报, 则目的地址可以是( ) 。", "options": ["A. 166.199.96.0", "B. 166.199.96.255", "C. 166.199.99.255", "D. 166.199.127.255"], "answer": "D", "explain": "/19 网络内广播地址为主机位全 1，即 166.199.127.255。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 21, "type": "单选题", "body": "在一条点对点的链路上,为了减少 IPv4 地址的浪费,可为其分配的地址块为 ( ) 。", "options": ["A. /8", "B. /16", "C. /30", "D. /31"], "answer": "C", "explain": "点对点链路用 /30，4 个地址两个可用。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 22, "type": "单选题", "body": "下列 IPv4 地址中,可以配置给主机使用的是( ) 。", "options": ["A. 0.0.0.0", "B. 255.255.255.255", "C. 127.0.0.1", "D. 192.168.0.1"], "answer": "D", "explain": "192.168.0.1 是私网地址可配主机；0.0.0.0、广播、环回都不能作主机地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 23, "type": "单选题", "body": "给主机甲和主机乙配置的 IP 地址分别是 211.67.230.11和211.67.208.11,若让甲和 乙工作在同一个网络中,应该给它们配置的地址掩码是( ) 。", "options": ["A. 255.255.255.0", "B. 255.255.240.0", "C. 255.255.224.0", "D. 255.255.192.0"], "answer": "D", "explain": "230 与 208 需同网，掩码 255.255.192.0 使二者网络号相同。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 24, "type": "单选题", "body": "设有4条路由172.18.129.0/24 、172.18.130.0/24、172.18.132.0/24 和172.18.133.0/24,进行路由聚合的结果是( ) 。", "options": ["A. 172.18.128.0/21", "B. 172.18.128.0/22", "C. 172.18.130.0/22", "D. 172.18.132.0/23"], "answer": "A", "explain": "129~133 覆盖 128~135 共 8 个 /24，聚合为 172.18.128.0/21。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 25, "type": "单选题", "body": "某公司网络如图 4-25所示IP地址空间192.168.16.0/25被均分给销售部和技术 部两个子网,并已分别为部分主机和路由器接口分配了IP地址,则销售部子网的 广播地址和技术部子网的网络地址分别是( ) 。[像领] 习题4-25 图", "options": ["A. 192.168.16.20, 192.168.16.65", "B. 192.168.16.63, 192.168.16.64", "C. 192.168.16.62, 192.168.16.126", "D. 192.168.16.20, 192.168.16.64"], "answer": "B", "explain": "192.168.16.0/25 均分两块：0~127 与 128~255，广播地址分别 63 和 255 相关取值。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 26, "type": "单选题", "body": "以下关于ARP协议的描述,错误的是( ) 。", "options": ["A. 根据IP地址查询MAC地址", "B. ARP请求报文的目的地址为广播地址", "C. ARP响应报文的目的地址为单播地址", "D. ARP协议不存在安全隐患"], "answer": "D", "explain": "ARP 无认证机制，存在 ARP 欺骗等安全隐患。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 27, "type": "单选题", "body": "下列情况需要启动ARP请求的是( ) 。", "options": ["A. 主机需要接收信息,但ARP表中没有源IP地址与MAC地址的映射关系", "B. 主机需要接收信息,但ARP表中已有源IP地址与MAC地址的映射关系", "C. 主机需要发送信息,但ARP表中没有目的IP地址与MAC地址的映射关系", "D. 主机需要发送信息,但ARP表中已有目的 IP 地址与 MAC 地址的映射关系"], "answer": "C", "explain": "发送时 ARP 表无目的 IP 的映射才发起 ARP 请求。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 28, "type": "单选题", "body": "封装有ARP广播请求的以太网帧的目的 MAC 地址为( ) 。", "options": ["A. 255.255.255.255", "B. FF-FF-FF-FF-FF-FF", "C. 0.0.0.0", "D. 00:12:34:AB:CD:EF"], "answer": "B", "explain": "ARP 广播帧的目的 MAC 为全 1 的 FF-FF-FF-FF-FF-FF。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 29, "type": "单选题", "body": "源主机给目的主机发送IP数据报,途中经过了5个路由器。在此过程中使用 ARP的最大可能次数是( ) 。", "options": ["A. 5", "B. 6", "C. 10", "D. 11"], "answer": "B", "explain": "源主机与 5 个路由器共 6 段链路，每段最多一次 ARP，共 6 次。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 30, "type": "单选题", "body": "不考虑 NAT 和传输误码。IPv4 数据报从源主机到目的主机可能需要经过多个网络和路由器。在整个传输过程中,IPv4 数据报首部中的( ) 。", "options": ["A. 源IP 地址和目的IP地址都不会发生变化", "B. 源IP地址有可能发生变化而目的IP地址不会发生变化", "C. 源IP地址不会发生变化而目的IP地址有可能发生变化", "D. 源IP地址和目的 IP 地址都有可能发生变化"], "answer": "A", "explain": "IP 首部源与目的地址端到端不变，变化的只是链路层地址。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 31, "type": "单选题", "body": "网络拓扑如图 4-31 所示,各设备接口的IP地址和MAC地址已标注在其旁边。主机A给 B发送一个IP分组P,则路由器R转发出的P的源IP地址以及封装P的以太网帧的源 MAC 地址分别是( ) 。[像领] 习题4-31图", "options": ["A. IP1,MAC1", "B. IP2,MAC2", "C. IP2,MAC3", "D. IP1，MAC3"], "answer": "D", "explain": "路由器只改帧头 MAC（改为出口 MAC3），源 IP 保持 IP1。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 32, "type": "单选题", "body": "在因特网中,一个路由器的路由表通常包含( ) 。", "options": ["A. 目的网络的IP地址和到达目的网络的完整路径", "B. 所有目的主机的IP地址和到达该目的主机的完整路径", "C. 目的网络的IP地址和到达该目的网络路径上的下一个路由器的IP地址", "D. 目的网络的IP地址和到达该目的网络路径上的下一个路由器的MAC地址"], "answer": "C", "explain": "路由表项是目的网络地址加下一跳路由器 IP。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 33, "type": "单选题", "body": "路由器转发IP数据报的依据是报文的( ) 。", "options": ["A. 端口号", "B. MAC 地址", "C. IP 地址", "D. 域名"], "answer": "C", "explain": "路由器按目的 IP 地址查表转发。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 34, "type": "单选题", "body": "列关于IP路由器功能的描述中,正确的是( ) 。I.对收到的IP分组头进行差错校验,若发现错误则将其丢弃II.监测到拥塞时,根据丢弃策略合理丢弃IP分组III.根据收到的IP分组的目的MAC地址进行转发IV.运行路由协议,构建路由表。", "options": ["A. 仅 I、 II", "B. 仅 I、 II、 III", "C. 仅 I、 II、 IV", "D. I、 II、 III、 IV"], "answer": "C", "explain": "路由器不重组分片，III 错误；其余 I、II、IV 正确。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 35, "type": "单选题", "body": "某路由器的路由表如图 4-35 所示,若该路由器收到一个目的地址为 206.0.71.130的 IP数据报,则转发该 IP 数据报的接口是( ) 。[像领] 习题4-35 图", "options": ["A. S0", "B. S1", "C. S2", "D. S3"], "answer": "B", "explain": "按最长前缀匹配查表，206.0.71.130 走 S1。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 36, "type": "单选题", "body": "IPv4 数据报首部中有两个有关长度的字段:首部长度和总长度,其中( ) 。", "options": ["A. 首部长度字段和总长度字段都以 8bit 为计数单位", "B. 首部长度字段以 8bit 为计数单位,总长度字段以 32bit 为计数单位", "C. 首部长度字段以 32bit 为计数单位,总长度字段以 8bit 为计数单位", "D. 首部长度字段和总长度字段都以 32bit 为计数单位"], "answer": "C", "explain": "首部长度以 4 字节（32bit）为单位，总长度以字节（8bit）为单位。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 37, "type": "单选题", "body": "IPv4 数据报首部中的校验字段检查范围是( ) 。", "options": ["A. 整个 IPv4 数据报", "B. 仅检查 IPv4 数据报的整个首部", "C. 仅检查 IPv4 数据报的数据载荷", "D. 仅检查 IPv4 数据报首部中的部分字段"], "answer": "B", "explain": "首部校验和只检查 IP 首部。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 38, "type": "单选题", "body": "如果 IPv4 数据报太大,会在传输中被分片,对分片后的数据报进行重组的是( ) 。", "options": ["A. 中间路由器", "B. 下一跳路由器", "C. 核心路由器", "D. 目的主机"], "answer": "D", "explain": "分片重组只发生在目的主机。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 39, "type": "单选题", "body": "在 IPv4 数据报的首部各字段中,与分片和重组无关的字段是( ) 。", "options": ["A. 总长度", "B. 标识", "C. 标志", "D. 片偏移"], "answer": "A", "explain": "总长度与分片重组无关；标识、标志、片偏移才相关。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 40, "type": "单选题", "body": "路由表错误和软件故障都可能使得网络中出现环路造成 IPv4 数据报在环路中兜圈,IPv4 协议解决该问题的方法是( ) 。", "options": ["A. 将 IPv4 数据报分片", "B. 设定 IPv4 数据报生命期", "C. 增加 IPv4 数据报的首部校验和", "D. 增加 IPv4 数据报首部中的选项字段"], "answer": "B", "explain": "通过 TTL 生命期字段防止数据报环路兜圈。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 41, "type": "单选题", "body": "假设某个 IPv4 数据报首部中的首部长度字段的值为(0101)2,总长度字段的值为 (0000001111111100)2,则该数据报的数据载荷的长度是( ) 。", "options": ["A. 20 字节", "B. 980 字节", "C. 1000 字节", "D. 1020 字节"], "answer": "C", "explain": "首部长度 5×4=20 字节，总长度 1020 字节，载荷 1000 字节。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 42, "type": "单选题", "body": "有一个长度为 4500 字节的 TCP 报文段。在网际层使用 IPv4 固定长度首部进行封装,在数据链路层使用以太网进行传输,为了正确传输,需要将其拆分成( )个IP 数据报片。", "options": ["A. 3", "B. 4", "C. 5", "D. 6"], "answer": "B", "explain": "4500+20=4520 字节，以太网每片载荷≤1480，需 4 片。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 43, "type": "单选题", "body": "以下关于 IPv4 数据报分片方法的描述中,错误的是( ) 。", "options": ["A. IPv4 数据报长度大于 MTU 时,必须对其进行分片", "B. DF=1 表示 IPv4 数据报允许被分片", "C. 分片的 MF=1 表示这不是一组分片中的最后一个分片", "D. 属于同一个原始 IPv4 数据报的分片具有相同的标识"], "answer": "B", "explain": "DF=1 表示不允许分片，B 描述错误。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 44, "type": "单选题", "body": "在路由表中设置一条默认路由,则其目的网络地址和子网掩码应分别设置为( ) 。", "options": ["A. 192.168.1.1、255.255.255.0", "B. 127.0.0.0、255.0.0.0", "C. 0.0.0.0、0.0.0.0", "D. 0.0.0.0、255.255.255.255"], "answer": "C", "explain": "默认路由目的网络和掩码均为 0.0.0.0。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 45, "type": "单选题", "body": "在路由表中为IP地址为 192.168.1.1 的主机设置一条特定主机路由,以下设置正确的是( )。", "options": ["A. 192.168.1.1、0.0.0.0", "B. 192.168.1.1、255.255.255.255", "C. 0.0.0.0、255.255.255.255", "D. 0.0.0.0、0.0.0.0"], "answer": "B", "explain": "特定主机路由掩码为全 1 的 255.255.255.255。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 46, "type": "单选题", "body": "某网络拓扑和相关IP 地址配置如图 4- 46 所示,路由器 R1 只有到达其直连网络10.0.0.0/30 的路由。为使 R1 可将 IP 分组正确地路由到图中所有子网,则在 R1 中需要增加的一条路由(目的网络,子网掩码,下一跳)是( ) 。[像领] 习题4-46 图", "options": ["A. 192.168.0.0, 255.255.255.192, 10.0.0.1", "B. 192.168.0.0, 255.255.255.0, 10.0.0.1", "C. 192.168.0.0, 255.255.255.192, 10.0.0.2", "D. 192.168.0.0, 255.255.255.0, 10.0.0.2"], "answer": "D", "explain": "R1 需一条覆盖 192.168.0.0/24 的路由，下一跳为 10.0.0.2。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 47, "type": "单选题", "body": "动态路由选择和静态路由选择的主要区别是( ) 。", "options": ["A. 动态路由选择需要维护整个网络的拓扑结构信息,而静态路由选择只需要维护部分拓扑结构信息", "B. 动态路由选择可随网络的通信量或拓扑变化而自适应地调整,而静态路由选择则需要手工去调整相关的路由信息", "C. 动态路由选择简单且开销小,静态路由选择复杂且开销大", "D. 动态路由选择使用路由表,静态路由选择不使用路由表"], "answer": "B", "explain": "动态路由自动适应拓扑变化，静态路由需手工配置。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 48, "type": "单选题", "body": "路由选择协议的功能不包括( ) 。", "options": ["A. 交换网络状态或通路信息", "B. 选择到达目的地的最佳路径", "C. 更新路由表", "D. 发现下一跳的物理地址"], "answer": "D", "explain": "发现下一跳物理地址是 ARP 的功能，不是路由协议的功能。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 49, "type": "单选题", "body": "可用于因特网域间路由选择的协议是( ) 。", "options": ["A. RIP", "B. BGP", "C. OSPF", "D. ARP"], "answer": "B", "explain": "BGP 是域间（AS 间）路由协议。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 50, "type": "单选题", "body": "下列属于 EGP 这类协议的是( ) 。", "options": ["A. AS", "B. BGP", "C. RIP", "D. OSPF"], "answer": "B", "explain": "BGP 属于外部网关协议 EGP。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 51, "type": "单选题", "body": "在 RIP 中,到某个网络的 RIP 距离值为 16,其意义是( ) 。", "options": ["A. 该网络不可达", "B. 存在路由环路", "C. 该网络为直连网络", "D. 到达该网络要经过 17 次转发"], "answer": "A", "explain": "RIP 距离 16 表示不可达，RIP 最大有效跳数 15。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 52, "type": "单选题", "body": "网络拓扑如图 4-52 所示,各路由器使用RIP协议进行路由选择且已收敛,主机A 给 B 发送一个IP数据报,其首部中的TTL字段的值设置为 64,则当主机 B 正确接收到该IP数据报时,其首部中的TTL字段的值为( ) 。[像领] 习题4-52图", "options": ["A. 60", "B. 61", "C. 62", "D. 63"], "answer": "B", "explain": "A 到 B 经 3 个路由器跳，TTL 减 3 为 61。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 53, "type": "单选题", "body": "OSPF 是基于链路状态的一种路由选择协议,以下相关描述错误的是( ) 。", "options": ["A. 仅相邻路由器需要交换各自的路由表", "B. 全网路由器的拓扑数据库最终会达到一致", "C. 采用洪泛技术更新链路变化信息", "D. 具有快速收敛的优点"], "answer": "A", "explain": "OSPF 交换链路状态而非路由表，A 描述错误。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 54, "type": "单选题", "body": "以下关于 OSPF 协议的描述中,最准确的是( ) 。", "options": ["A. OSPF 协议根据链路状态法计算最佳路由", "B. OSPF 协议是用于自治系统之间的外部网关协议", "C. OSPF 协议不能根据网络通信情况动态地改变路由", "D. OSPF 协议只适用于小型网络"], "answer": "A", "explain": "OSPF 基于链路状态法计算最佳路由。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 55, "type": "单选题", "body": "网络拓扑如图 4-67 所示,假设各路由器使用OSPF协议进行路由选择且已收敛,各链路的度量已标注在其旁边。 主机A给B发送一个IP数据报,其首部中的TTL 字段的值设置为32,则当主机 B 正确接收到该IP数据报时,其首部中的TTL 字段的值为( ) 。 [像领] 习题4-67 图", "options": ["A. 28", "B. 29", "C. 30", "D. 31"], "answer": "A", "explain": "TTL=32 经 4 跳路由后剩 28。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 56, "type": "单选题", "body": "下列关于 ICMP 报文的说法中,错误的是( ) 。", "options": ["A. ICMP 报文直接封装在链路层帧中发送", "B. ICMP 报文用于报告 IP 数据报的相关错误", "C. ICMP 报文封装在 IP 数据报中发送", "D. ICMP 报文本身出错将不再处理"], "answer": "A", "explain": "ICMP 封装在 IP 数据报中，不直接封装在链路层帧。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 57, "type": "单选题", "body": "若路由器检查出所收到的 IPv4 数据报的首部出现了误码,路由器会丢弃该 IPv4数据报并向该 IPv4 数据报的源主机发送 ICMP 差错报告报文, 其类型是( ) 。", "options": ["A. 路由重定向", "B. 源点抑制", "C. 时间超过", "D. 参数问题"], "answer": "D", "explain": "首部误码对应 ICMP 参数问题报文。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 58, "type": "单选题", "body": "以下关于 ICMP 差错报告报文的描述中,错误的是( ) 。", "options": ["A. 对 ICMP 差错报告报文不再发送 ICMP 差错报告报文", "B. 对第一个分片的数据报片的所有后续数据报片都不发送 ICMP 差错报告报文", "C. 对具有多播地址的数据报都不发送 ICMP 差错报告报文", "D. 对具有特殊地址( 如 127.0.0.0 或 0.0.0.0) 的数据报可以发送 ICMP 差错报告报文"], "answer": "D", "explain": "特殊地址（环回、0.0.0.0）的数据报不发送差错报告。"}, {"sheet": "第4章 网络层 课后测试题-24级", "index": 59, "type": "单选题", "body": "若路由器因为 IP 分组首部中的TTL字段的值为 0 而将其丢弃,则此时路由器向该 IP 分组的源主机发送的 ICMP 报文类型是( ) 。", "options": ["A. 目的不可达", "B. 源点抑制", "C. 超时", "D. 参数问题"], "answer": "C", "explain": "TTL 为 0 丢弃时发送 ICMP 超时报文。"}, {
